# Dokumentarten des Arbeitsplatzes (Format: docs/arbeitsplatz-plan.md, Abschnitt "Arten-Datei").
# Geprüft von agentkit.arten (Tests in shared/agentkit/tests/test_arten.py prüfen diese Datei).
# Nur Arten mit aktiv = true stehen in der Galerie. material: "nein" | "optional" (Standard) | "pflicht".
# Felder: art = zeile | text | auswahl | zahl, pflicht, werte (nur bei auswahl), hilfe (kurzer Hinweis im Formular).
# Die Felder sind ein erster Entwurf (Sitzung A, 09.11.); die Agenten lesen sie aus a["felder"] und dem Auftragstext.

[[art]]
kennung = "recherche"
name = "Research-Bericht"
beschreibung = "Recherche zu einer Frage mit geprüften Belegen"
agent = "uni"
aktiv = true
ausgabe = ["pdf", "docx"]
ansicht = "recherche"
[[art.feld]]
name = "Frage"
art = "text"
pflicht = true
[[art.feld]]
name = "Hinweise"
art = "text"

