# Dokumentarten des Arbeitsplatzes (Format: docs/arbeitsplatz-plan.md, Abschnitt "Arten-Datei").
# Geprüft von agentkit.arten (shared/agentkit/tests/test_arten.py prüft diese Datei).
# Nur Arten mit aktiv = true stehen in der Galerie.
# material: "nein" | "optional" (Standard) | "pflicht"; material_oder = "<Feld>": dieses Feld oder eine Datei ist Pflicht.
# rueckmeldung = false: der Agent nimmt zu dieser Art keine Rückmeldung an (Standard true).
# Felder: art = zeile | text | auswahl | zahl, pflicht, werte (nur bei auswahl), hilfe (kurzer Hinweis im Formular).
# Felder von uni (Sitzung B, 182498d) und dokumente (Sitzung C, 6ef033f, e122de8). Die Agenten lesen die Feldnamen.

[[art]]
kennung = "recherche"
name = "Research-Bericht"
beschreibung = "Recherche zu einem Thema mit geprüften Belegen"
agent = "uni"
aktiv = true
ausgabe = ["md"]
ansicht = "recherche"
material = "nein"
rueckmeldung = false
[[art.feld]]
name = "Thema"
art = "zeile"
pflicht = true
[[art.feld]]
name = "Fragestellung"
art = "text"
[[art.feld]]
name = "Umfang"
art = "auswahl"
werte = ["kurz", "gründlich"]

