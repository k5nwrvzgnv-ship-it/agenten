# Design-Profil für Jans Zusammenfassungen (Art "zusammenfassung"). Abgestimmt mit Jan am 22.10.2026:
# Calibri 11 (in der PDF maßgleich durch Carlito), Farben der HNEE, Logo über eine Word-Vorlage mit Logo in der
# Kopfzeile (liegt beim dokumente-Agenten unter data/vorlagen/, nicht im Renderer).
# Vorlage für den dokumente-Agenten: Datei dorthin kopieren und erstellt_von eintragen. Werte: design.py.
# HNEE-Farben: Burnham 00261E (dunkelgrün), Sycamore 949547 (oliv); Flächen sind Aufhellungen von Sycamore.

erstellt_von = ""    # z. B. Jans Name, steht im Kopf als "erstellt von ..."
schrift = "Calibri"
schriftgroesse_pt = 11
zeilenabstand = 1.15

[farben]
ueberschrift = "00261E"       # HNEE Burnham: Überschriften, Kurs im Kopf, Linie, Balken der Kästen
pruefungsrelevant = "DFDFC8"  # HNEE Sycamore, 30 %: Hinweis prüfungsrelevant
organisatorisch = "F2F2F2"    # Hinweis Organisatorisches (hellgrau)
rechenbeispiel = "F2F2F2"     # Rechenbeispiel (hellgrau)
tabellenkopf = "EAEADA"       # HNEE Sycamore, 20 %: Kopfzeile der Tabellen
kennzeichnung = "7F7F7F"      # [unsicher], [nur mündlich], Quellen (grau)
