# Design-Profil im Stil von Lias Arbeitsblättern und Präsentationen (vermessen an AB 5.2 und Präsentation 5).
# Vorlage für Lias Agenten: Datei dorthin kopieren und fach/lehrkraft eintragen. Werte und Bedeutung: design.py.
# Laden im Agenten: profil = tomllib.load(open(pfad, "rb")); renderer.bauen(..., profil=profil)

fach = ""            # z. B. "Ethik", steht im Kopf des Arbeitsblatts
lehrkraft = ""       # z. B. "Frau ...", steht im Kopf des Arbeitsblatts
nummer_text = "Arbeitsblatt"
schrift = "Calibri"
schriftgroesse_pt = 11
zeilenabstand = 1.15
linienabstand_cm = 0.6
folien_schrift = "Aptos"
folien_titelschrift = "Aptos Display"

[farben]
thema = "FFD873"      # Thema im Kopf des Arbeitsblatts (gelb)
merksatz = "F2CEED"   # Merksatz-Kasten (rosa)
material = "D9F2D0"   # Material (grün)
akzent = "C00000"     # Folien: Titel, Strich, Balken, Leitfrage (rot)
kasten = "F5F5F5"     # Folien: Kästen (hellgrau)
satzanfang = "196B24" # Folien: Satzanfänge (dunkelgrün)
