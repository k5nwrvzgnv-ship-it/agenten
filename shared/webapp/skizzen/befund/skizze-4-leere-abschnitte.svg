<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="sans-serif" font-size="13"><rect width="900" height="520" fill="#1b1b1b"/><rect width="150" height="520" fill="#232323"/><text x="12" y="24" fill="#ddd" font-weight="bold">Navigation</text><text x="180" y="60" fill="#eee" font-size="26" font-weight="bold">Helfen</text><text x="180" y="85" fill="#aaa">Muss ich fremden Menschen in Not genauso helfen …</text><text x="700" y="60" fill="#8a8">✓ abgeschlossen</text><text x="180" y="130" fill="#bbb">Gespräche  ·  0</text><text x="680" y="130" fill="#777">+</text><text x="180" y="160" fill="#bbb">Material  ·  0</text><text x="680" y="160" fill="#777">+</text><text x="180" y="190" fill="#bbb">Dateien  ·  0</text><text x="680" y="190" fill="#777">+</text><text x="180" y="220" fill="#bbb">Stunden  ·  0</text><text x="680" y="220" fill="#777">+</text><text x="180" y="300" fill="#e3a33b" font-size="12">Leere Bereiche = eine Zeile mit Zähler und +. Kein „Noch nichts …“-Absatz je Bereich.</text><text x="180" y="320" fill="#e3a33b" font-size="12">Heute: „Weiter im Gespräch“ und „Läuft gerade“ nur zeigen, wenn es etwas gibt.</text></svg>