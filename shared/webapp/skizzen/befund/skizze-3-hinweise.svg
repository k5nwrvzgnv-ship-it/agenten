<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="sans-serif" font-size="13"><rect width="900" height="520" fill="#1b1b1b"/><rect width="150" height="520" fill="#232323"/><text x="12" y="24" fill="#ddd" font-weight="bold">Navigation</text><text x="180" y="40" fill="#eee" font-size="18" font-weight="bold">Deine Dateien</text><text x="330" y="40" fill="#888">+</text><rect x="180" y="60" width="520" height="70" rx="8" fill="none" stroke="#666" stroke-dasharray="6 4"/><text x="300" y="100" fill="#aaa">Datei hierher ziehen oder klicken</text><rect x="180" y="160" width="520" height="110" rx="6" fill="#262626" stroke="#444"/><text x="190" y="180" fill="#ddd" font-size="13">Dialog nach Auswahl: „PDF, Word … bis 20 MB. Keine Schülerdaten.“  [Ablegen]</text><text x="180" y="310" fill="#e3a33b" font-size="12">Hinweis erscheint, wenn er gebraucht wird: beim Ablegen, im Platzhalter des Eingabefelds, beim ersten Besuch.</text><text x="180" y="330" fill="#e3a33b" font-size="12">„+ Datei ablegen“ und „Hochladen“ werden ein Vorgang.</text></svg>