<title>Skizze Gespräch für Lia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Ruhige Oberfläche (Plan ui-plan-notion.md): eine Schrift (Inter 400/500/600), Größen 12/14/16/20/32 (schmal 26),
   1-px-Linien nur wo nötig, graue Flächen, ein gedecktes Blau für Hauptknopf und Fokus, Rot nur für "wartet".
   Aufbau: Leiste der Skizze oben, darunter die App: Baum | Mitte (Ebene oder Gespräch) | rechts "An dieser Ebene".
   Gespräche und Material hängen immer an einer Ebene: Klasse/Kurs, Reihe, Stunde. */
:root {
  --bg: #ffffff; --fg: #37352f; --leise: #787774; --sehrleise: #9b9a97; --linie: #e9e9e7; --flaeche: #f7f7f5;
  --hover: rgba(55, 53, 47, .06); --wahl: rgba(55, 53, 47, .09); --akzent: #d44c47; --blau: #2f6fbf; --fokus: #2f6fbf;
  --umkehr: #ffffff; --skizze: #f2d675; --schatten: 0 8px 28px rgba(15, 15, 15, .14), 0 0 0 1px rgba(15, 15, 15, .05);
  --schrift: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #191919; --fg: #e6e6e3; --leise: #9b9b97; --sehrleise: #6f6f6b; --linie: #2f2f2f; --flaeche: #202020;
  --hover: rgba(255, 255, 255, .055); --wahl: rgba(255, 255, 255, .09); --akzent: #ff7369; --blau: #4f8ad8; --fokus: #7fb0f0;
  --umkehr: #ffffff; --skizze: #8a7322; --schatten: 0 8px 28px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .08); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #191919; --fg: #e6e6e3; --leise: #9b9b97; --sehrleise: #6f6f6b; --linie: #2f2f2f; --flaeche: #202020;
  --hover: rgba(255, 255, 255, .055); --wahl: rgba(255, 255, 255, .09); --akzent: #ff7369; --blau: #4f8ad8; --fokus: #7fb0f0;
  --umkehr: #ffffff; --skizze: #8a7322; --schatten: 0 8px 28px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .08); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--schrift); font-size: 16px; line-height: 1.5; margin: 0; -webkit-font-smoothing: antialiased }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--fokus); outline-offset: 2px; border-radius: 4px }
h1, h2, h3 { text-wrap: balance }

/* Leiste der Skizze: schmal, gelber Streifen oben als Zeichen "nur Skizze" */
.leiste { background: var(--bg); border-top: 4px solid var(--skizze); border-bottom: 1px solid var(--linie); min-height: 44px;
  padding-block: 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: center; font-size: 14px }
.leiste strong { font-size: 14px; font-weight: 600 }
.leiste nav { display: flex; flex-wrap: wrap; gap: 4px }
.leiste nav a { display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px; border-radius: 6px; color: var(--leise); text-decoration: none; font-weight: 500 }
.leiste nav a:hover { background: var(--hover); color: var(--fg) }
.leiste nav a[aria-current="page"] { color: var(--fg); background: var(--wahl) }
.leiste .hinweis { font-size: 12px; color: var(--leise); flex: 1 1 260px }
.leiste .zurueck { border: 0; background: none; color: var(--leise); font-size: 12px; padding: 6px 8px; border-radius: 6px }
.leiste .zurueck:hover { background: var(--hover); color: var(--fg) }

/* App */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr) 300px; min-height: calc(100vh - 48px) }
.app.ohne-rechts { grid-template-columns: 240px minmax(0, 1fr) }
.baum { background: var(--flaeche); padding: 12px 8px 32px; display: flex; flex-direction: column; gap: 1px; min-width: 0; font-size: 14px }
.baum .name { padding: 6px 10px 12px; font-size: 14px; font-weight: 600 }
.baum .kopf { padding: 16px 10px 4px; font-size: 12px; font-weight: 500; color: var(--sehrleise) }
.baum button { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 30px;
  padding: 4px 10px; border: 0; border-radius: 6px; background: transparent; text-align: left; font-size: 14px; font-weight: 400; color: var(--fg) }
.baum button:hover { background: var(--hover) }
.baum button.e1 { padding-left: 24px }
.baum button.e2 { padding-left: 38px; color: var(--leise) }
.baum button:disabled { color: var(--sehrleise); cursor: default }
.baum button:disabled:hover { background: transparent }
.baum button[aria-current="location"] { background: var(--wahl); font-weight: 600; color: var(--fg) }
.baum button.im-pfad { font-weight: 500 }
.baum .zahl { font-size: 12px; font-weight: 400; color: var(--sehrleise); white-space: nowrap; font-variant-numeric: tabular-nums }
.baum .zahl.rot { color: var(--akzent); font-weight: 500 }

main { min-width: 0; padding: 16px 48px 64px; display: flex; flex-direction: column; gap: 24px }
.krumen { display: flex; flex-wrap: wrap; gap: 2px; font-size: 14px; color: var(--leise); align-items: center }
.krumen button { border: 0; background: none; padding: 2px 6px; border-radius: 4px; color: var(--leise); font-size: 14px }
.krumen button:hover { background: var(--hover); color: var(--fg) }
.krumen b { color: var(--fg); font-weight: 500; padding: 2px 6px }
.hinweisband { margin: 0; padding: 8px 8px 8px 14px; border-radius: 8px; background: var(--flaeche); box-shadow: 0 0 0 1px var(--linie); font-size: 14px;
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }

.knopf { min-height: 32px; padding: 0 12px; border: 1px solid var(--linie); border-radius: 6px; background: var(--bg); font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; color: var(--fg); text-decoration: none }
.knopf:hover { background: var(--hover) }
.knopf:disabled { opacity: .45; cursor: default }
.knopf-voll { background: var(--blau); border-color: var(--blau); color: var(--umkehr) }
.knopf-voll:hover { background: var(--blau); filter: brightness(1.08) }
.knopf-klein { min-height: 28px; padding: 0 10px }
.knopf-leise { border: 0; background: none; color: var(--leise); font-size: 14px; font-weight: 500; padding: 0 8px; min-height: 28px; border-radius: 6px }
.knopf-leise:hover { background: var(--hover); color: var(--fg) }
.knoepfe { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }

.titel { display: flex; flex-direction: column; gap: 8px }
.augenbraue { font-size: 12px; font-weight: 400; color: var(--leise) }
.titel h1 { margin: 0; font-size: 32px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em }
.titel p { margin: 0 }
.ebenenmarke { display: inline-flex; align-self: flex-start; font-size: 12px; color: var(--leise) }

/* Ebenen-Ansicht */
.ebene { max-width: 720px; width: 100%; display: flex; flex-direction: column; gap: 32px }
.spalten { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px }
.abschnitt { margin: 0 0 4px; font-size: 20px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.abschnitt .leise { font-size: 14px; font-weight: 400 }
.gruppe { margin: 12px 0 2px; font-size: 14px; font-weight: 500; color: var(--leise); display: flex; gap: 6px; align-items: baseline }
.gruppe button { border: 0; background: none; padding: 0; color: var(--leise); font-weight: 500; text-align: left }
.gruppe button:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px }
.gruppe .ebenenwort { font-size: 12px; color: var(--sehrleise); font-weight: 400 }
.liste { display: flex; flex-direction: column; margin: 0 -8px }
.liste .zeile { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 6px 8px; border: 0; border-radius: 6px; background: none; text-align: left; width: 100%; color: var(--fg) }
.liste button.zeile:hover { background: var(--hover) }
.liste .zeile b { display: block; font-size: 16px; font-weight: 500 }
.liste .zeile small { font-size: 12px; color: var(--leise) }
.marke { font-size: 12px; font-weight: 400; color: var(--leise); align-self: center; white-space: nowrap }
.rot { color: var(--akzent) }
.marke.rot { font-weight: 500 }
.leer { font-size: 14px; color: var(--sehrleise); padding: 6px 0; margin: 0 }
.leise { color: var(--leise); font-size: 14px }

/* Gespräch */
.gespraech { max-width: 760px; width: 100%; display: flex; flex-direction: column; gap: 20px }
.gkopf { display: flex; flex-direction: column; gap: 4px }
.gkopf .z { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px }
.gkopf .gname { font-size: 20px; font-weight: 600; flex: 1 1 auto; line-height: 1.3 }
.gkopf input { min-height: 32px; border: 1px solid var(--linie); border-radius: 6px; padding: 0 8px; font-size: 16px; font-weight: 500; flex: 1 1 220px; background: var(--bg) }
.verlauf { display: flex; flex-direction: column; gap: 24px }
.tag { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--sehrleise) }
.tag::before, .tag::after { content: ""; flex: 1; border-top: 1px solid var(--linie) }
.msg { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.msg .wer { font-size: 12px; color: var(--sehrleise) }
.msg.du { align-items: flex-end }
.msg.du .text { background: var(--flaeche); padding: 10px 14px; border-radius: 12px; max-width: 600px; white-space: pre-wrap }
.antwort { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.antwort h3 { margin: 8px 0 0; font-size: 16px; font-weight: 600 }
.antwort p, .antwort ul { margin: 0 }
.antwort ul { padding-left: 22px }
.tabelle { overflow-x: auto; max-width: 100% }
.tabelle table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px }
.tabelle th { text-align: left; font-size: 12px; font-weight: 500; color: var(--leise); border-bottom: 1px solid var(--linie); padding: 6px 12px 6px 0 }
.tabelle td { border-bottom: 1px solid var(--linie); padding: 8px 12px 8px 0; vertical-align: top }
.baustein { background: var(--flaeche); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px }
.baustein .bt { font-size: 16px; font-weight: 500; line-height: 1.5 }
.foto { width: 220px; max-width: 100%; border: 1px solid var(--linie); border-radius: 8px; overflow: hidden; background: var(--bg) }
.foto img, .foto svg { display: block; width: 100%; height: auto }
.foto span { display: block; font-size: 12px; padding: 4px 8px; color: var(--leise) }
.denkt { font-size: 14px; color: var(--leise) }

.eingabe { border: 1px solid var(--linie); border-radius: 12px; box-shadow: 0 1px 4px rgba(15, 15, 15, .06); display: flex; flex-direction: column;
  position: sticky; bottom: max(8px, env(safe-area-inset-bottom, 0px)); background: var(--bg) }
.eingabe textarea { border: 0; resize: vertical; min-height: 72px; padding: 12px 14px 4px; background: transparent; border-radius: 12px; outline-offset: -2px }
.eingabe .anh { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px }
.eingabe .anh:empty { display: none }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linie); border-radius: 6px; padding: 2px 4px 2px 2px; font-size: 12px; max-width: 100% }
.chip img { width: 36px; height: 36px; object-fit: cover; display: block; border-radius: 4px }
.chip button { border: 0; background: none; min-height: 28px; padding: 0 4px; color: var(--leise) }
.eingabe .leiste2 { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 6px 8px }
.eingabe .links, .eingabe .rechts { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center }
.eingabe label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--leise) }
.kennt { font-size: 12px; color: var(--sehrleise); margin: 0 }
.datei-knopf { position: relative; overflow: hidden }
.datei-knopf input { position: absolute; inset: 0; opacity: 0; cursor: pointer }

/* Rechte Spalte */
aside.rechts { border-left: 1px solid var(--linie); padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 24px; min-width: 0; font-size: 14px }
aside.rechts h2.gross { margin: 0; font-size: 14px; font-weight: 600 }
aside .block { display: flex; flex-direction: column; gap: 4px }
aside .block ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
aside .block li { padding: 3px 0; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
aside .block li small { font-size: 12px; color: var(--sehrleise) }
aside .block li.unter { padding-left: 12px }
aside .block li.gk { padding: 8px 0 2px; font-size: 12px; color: var(--sehrleise) }
aside button.link { border: 0; background: none; padding: 0; text-align: left; color: var(--fg) }
aside button.link:hover { text-decoration: underline; text-underline-offset: 3px }
aside .block li[aria-current="true"] button.link { font-weight: 600 }
aside .rf { font-size: 14px; font-weight: 500; margin: 0 }
aside .kette { display: flex; flex-direction: column; border: 1px solid var(--linie); border-radius: 8px; overflow: hidden }
aside .kette div { padding: 4px 10px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px }
aside .kette div small { color: var(--sehrleise); font-size: 12px }
aside .kette div.hier { background: var(--wahl); font-weight: 600 }

/* Überlagerung */
.schicht { position: fixed; inset: 0; background: rgba(15, 15, 15, .35); display: flex; justify-content: center; align-items: flex-start; padding: 64px 16px; overflow-y: auto; z-index: 20 }
.fenster { background: var(--bg); border-radius: 10px; box-shadow: var(--schatten); width: 100%; max-width: 640px; padding: 24px; display: flex; flex-direction: column; gap: 14px; font-size: 14px }
.fenster h2 { margin: 0; font-size: 20px; font-weight: 600 }
.fenster p { margin: 0 }
.fenster label { font-weight: 500; display: flex; flex-direction: column; gap: 6px }
.fenster textarea, .fenster select { border: 1px solid var(--linie); border-radius: 6px; padding: 8px 10px; background: var(--bg); font-weight: 400; font-size: 14px }
.fenster textarea { min-height: 220px; resize: vertical; line-height: 1.5 }
.ablegefeld { border: 1px dashed var(--linie); border-radius: 8px; padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center }

/* Lückenliste */
.luecken { max-width: 760px; margin: 0 auto; padding-block: 40px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 28px }
.luecken h1 { margin: 0; font-size: 32px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em }
.luecken .zahlen { display: flex; flex-wrap: wrap; gap: 8px 32px; font-size: 14px; color: var(--leise) }
.luecken .zahlen b { display: block; font-size: 20px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums }
.lz { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--linie); align-items: start }
.lz .n { font-size: 14px; font-weight: 600; color: var(--leise); font-variant-numeric: tabular-nums; text-align: right; padding-top: 1px }
.lz .balken { grid-column: 2; height: 3px; background: var(--linie); border-radius: 2px; margin-top: 4px }
.lz .balken i { display: block; height: 100%; background: var(--sehrleise); border-radius: 2px }
.lz b { font-size: 16px; font-weight: 500 }
.lz p { margin: 2px 0 0; color: var(--leise); font-size: 14px }
.lz .wo { font-size: 12px; color: var(--leise); white-space: nowrap }
.lz .wo a { color: var(--leise) }
.frage { background: var(--flaeche); border-radius: 8px; padding: 16px 20px; font-size: 20px; font-weight: 600; line-height: 1.3 }
.frage small { display: block; font-size: 14px; font-weight: 400; color: var(--leise); margin-top: 6px }

@media (max-width: 1100px) {
  .app, .app.ohne-rechts { grid-template-columns: 220px minmax(0, 1fr) }
  aside.rechts { grid-column: 2; border-left: 0; border-top: 1px solid var(--linie); padding-left: 48px; padding-right: 48px }
}
@media (max-width: 860px) { .spalten { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 760px) {
  .app, .app.ohne-rechts { grid-template-columns: minmax(0, 1fr) }
  .baum { padding-bottom: 12px; border-bottom: 1px solid var(--linie) }
  aside.rechts { grid-column: 1; padding-left: 16px; padding-right: 16px }
  main { padding: 16px 16px 40px }
  .titel h1, .luecken h1 { font-size: 26px }
  .lz { grid-template-columns: 32px minmax(0, 1fr) }
  .lz .wo { grid-column: 2 }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<div class="leiste">
  <strong>Skizze: Gespräch in der Mitte</strong>
  <nav aria-label="Teile der Skizze">
    <a href="#luecken" data-seite="luecken">1 Was fehlt</a>
    <a href="#skizze" data-seite="skizze">2 So könnte es aussehen</a>
  </nav>
  <span class="hinweis">Nur ein Bild zum Klicken. Niemand antwortet wirklich, nichts wird gespeichert oder verschickt. Alle Texte sind Beispiele.</span>
  <button type="button" class="zurueck" id="zuruecksetzen">Skizze zurücksetzen</button>
</div>
<div id="wurzel"></div>
<div id="schicht"></div>

<script>
(function () {
'use strict';

// ---------- Ebenen: Fach > Klasse/Kurs > Reihe > Stunde (Lias Orte wie in der App) ----------
const STUNDEN = ['Einstieg: Ist Gefängnis gerecht?', 'Kant: Vergeltung', 'Anwendung Kant', 'von Liszt: Wozu strafen?', 'Prüfungsstunde: Anwendung von Liszt'];
const E = {
  e8:       { typ: 'Klasse', fach: 'Ethik', name: 'Klasse 8 · 2026/27', kurz: '8', eltern: null, kinder: ['strafe', 'helfen'] },
  strafe:   { typ: 'Reihe', name: 'Straftheorien', kurz: 'Straftheorien', eltern: 'e8', kinder: ['s1', 's2', 's3', 's4', 's5'], stand: 'läuft', reihenfrage: true },
  helfen:   { typ: 'Reihe', name: 'Helfen', kurz: 'Helfen', eltern: 'e8', kinder: [], stand: 'abgeschlossen', reihenfrage: true },
  k11:      { typ: 'Kurs', fach: 'Darstellendes Spiel', name: 'Kurs 11 · 2026/27', kurz: 'Kurs 11', eltern: null, kinder: [] },
  k12:      { typ: 'Kurs', fach: 'Darstellendes Spiel', name: 'Kurs 12 · 2026/27', kurz: 'Kurs 12', eltern: null, kinder: ['wahnsinn'] },
  wahnsinn: { typ: 'Inszenierung', name: 'Der nackte Wahnsinn', kurz: 'Der nackte Wahnsinn', eltern: 'k12', kinder: [], stand: 'läuft', rahmen: '35 bis 40 Minuten, 18 Spieler*innen, drei Akte.' },
  ohne:     { typ: 'Ohne Ort', name: 'Gespräche ohne Ort', kurz: 'Ohne Ort', eltern: null, kinder: [] }
};
STUNDEN.forEach((t, i) => { E['s' + (i + 1)] = { typ: 'Stunde', name: 'Stunde ' + (i + 1) + ' · ' + t, kurz: 'Stunde ' + (i + 1), titel: t, eltern: 'strafe', kinder: [], marke: i === 4 ? 'Examen' : '' }; });

const FOTO_BEISPIEL = '<svg viewBox="0 0 220 160" role="img" aria-label="Beispielfoto: handschriftliche Planung auf kariertem Papier"><rect width="220" height="160" fill="#f7f3e8"/><g stroke="#d9d3c2" stroke-width="1">' +
  Array.from({length: 15}, (_, i) => '<line x1="0" y1="' + (i * 11 + 4) + '" x2="220" y2="' + (i * 11 + 4) + '"/>').join('') +
  Array.from({length: 20}, (_, i) => '<line y1="0" x1="' + (i * 11 + 4) + '" y2="160" x2="' + (i * 11 + 4) + '"/>').join('') +
  '</g><g stroke="#2b3a67" stroke-width="2" fill="none" stroke-linecap="round"><path d="M14 22 q8 -6 16 0 t16 0 t16 0 t16 0"/>' +
  [44, 66, 88, 110, 132].map((y, i) => '<text x="12" y="' + (y + 4) + '" font-size="12" fill="#2b3a67" stroke="none" font-family="Georgia, serif">' + (i + 1) + '</text><path d="M28 ' + y + ' q10 -5 20 0 t20 0 t20 0 t' + (20 + i * 4) + ' 0' + (i % 2 ? ' t18 0' : '') + '"/>').join('') +
  '</g><rect x="150" y="104" width="56" height="30" fill="none" stroke="#c0392b" stroke-width="2"/></svg>';

function baustein(art, text, reihenfrage) {
  return '<div class="baustein"><span class="augenbraue">Baustein · ' + art + '</span><div class="bt">' + text + '</div><div class="knoepfe">' +
    '<button type="button" class="knopf knopf-klein" data-akt="kopieren">Kopieren</button>' +
    (reihenfrage ? '<button type="button" class="knopf knopf-klein" data-akt="reihenfrage">Als Reihenfrage übernehmen</button>' : '') + '</div></div>';
}

function frische() {
  return {
    seite: 'luecken', ebene: 'strafe', gespraech: null, band: '', vorher: null, umbenennen: false,
    anhang: [], entwurf: '', gruendlich: false, netz: false, schicht: null, ablegenDatei: '', heute: false,

let S = frische();

// ---------- Hilfen ----------
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const jetzt = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const kette = (k) => { const r = []; for (let x = k; x; x = E[x].eltern) r.unshift(x); return r; };      // von oben bis k
const fachVon = (k) => E[kette(k)[0]].fach;
const pfad = (k) => k === 'ohne' ? 'Ohne Ort' : [fachVon(k)].concat(kette(k).map((x) => E[x].kurz)).join(' › ');
const unter = (k) => E[k].kinder.reduce((a, c) => a.concat([c], unter(c)), []);                    // alle darunter, in Reihenfolge
const gHier = (k) => Object.keys(S.gespraeche).filter((id) => S.gespraeche[id].ort === k);
const mHier = (k) => S.material.filter((m) => m.ort === k);
const gAlle = (k) => [k].concat(unter(k)).reduce((n, x) => n + gHier(x).length, 0);
const mAlle = (k) => [k].concat(unter(k)).reduce((n, x) => n + mHier(x).length, 0);
const ebeneWort = (k) => ({ Klasse: 'der Klasse', Kurs: 'dem Kurs', Reihe: 'der Reihe', Stunde: 'der Stunde', Inszenierung: 'der Inszenierung', 'Ohne Ort': 'ohne Ort' }[E[k].typ]);
const relName = (d, k) => kette(d).slice(kette(k).length).map((x) => E[x].typ === 'Stunde' ? E[x].name : E[x].kurz).join(' › ');
const reiheVon = (k) => kette(k).find((x) => E[x].reihenfrage);
const zahlen = (g, m) => [g ? g + ' Gespr.' : '', m ? m + ' Mat.' : ''].filter(Boolean).join(' · ');

// ---------- Baum ----------
function baum() {
  const offen = kette(S.ebene);
  const knoten = (k, cls) => {
    const cur = !S.heute && k === S.ebene;
    const imPfad = !S.heute && !cur && offen.includes(k);
    const z = zahlen(gHier(k).length, mHier(k).length);
    let h = '<button type="button" class="' + (cls || '') + (imPfad ? ' im-pfad' : '') + '" data-akt="ebene" data-ziel="' + k + '"' + (cur ? ' aria-current="location"' : '') + '>' +
      '<span>' + esc(E[k].typ === 'Stunde' ? (E[k].kurz.replace('Stunde ', '') + '  ' + E[k].titel) : E[k].name.replace(' · 2026/27', '')) + '</span>' + (z ? '<span class="zahl">' + z + '</span>' : '') + '</button>';
    if (E[k].typ === 'Reihe' && offen.includes(k)) E[k].kinder.forEach((c) => { h += knoten(c, 'e2'); });
    return h;
  };
  return '<nav class="baum" aria-label="Ordnung"><span class="name">Lias Assistenz</span>' +
    '<button type="button" data-akt="heute"' + (S.heute ? ' aria-current="location"' : '') + '><span>Heute</span><span class="zahl rot">3</span></button>' +
    '<span class="kopf">Ethik</span>' + knoten('e8') + knoten('strafe', 'e1') + knoten('helfen', 'e1') +
    '<button type="button" disabled><span>Archiv: Klasse 7 · 2025/26</span></button>' +
    '<span class="kopf">Darstellendes Spiel</span>' + knoten('k11') + knoten('k12') + knoten('wahnsinn', 'e1') +
    '<button type="button" disabled><span>Archiv: Kurs 11 · 2025/26</span></button>' +
    '<span class="kopf">Mehr</span>' + knoten('ohne') +
    '<button type="button" disabled><span>Vorlagen</span></button><button type="button" disabled><span>Ich</span></button></nav>';
}

function krumen(k) {
  if (S.heute) return '<nav class="krumen" aria-label="Brotkrumen"><b>Heute</b></nav>';
  if (k === 'ohne') return '<nav class="krumen" aria-label="Brotkrumen"><b>Gespräche ohne Ort</b></nav>';
  const ks = kette(k);
  return '<nav class="krumen" aria-label="Brotkrumen"><span>' + esc(fachVon(k)) + ' ›</span>' +
    ks.map((x, i) => i === ks.length - 1 && !S.gespraech ? '<b>' + esc(E[x].kurz) + '</b>' :
      '<button type="button" data-akt="ebene" data-ziel="' + x + '">' + esc(E[x].kurz) + '</button><span>›</span>').join('') +
    (S.gespraech ? '<b>' + esc(S.gespraeche[S.gespraech].name) + '</b>' : '') + '</nav>';
}

// ---------- Ebenen-Ansicht: was hier hängt und was darunter liegt ----------
function zeileG(id, mitOrt) {
  const g = S.gespraeche[id];
  const n = g.msgs.filter((m) => m.wer === 'du' || m.wer === 'claude').length;
  return '<button type="button" class="zeile" data-akt="oeffnen" data-id="' + id + '"><span><b>' + esc(g.name) + '</b><small>' + (mitOrt ? esc(pfad(g.ort)) + ' · ' : '') + n + ' Nachrichten · zuletzt ' + esc(g.zuletzt) + '</small></span><span class="marke">öffnen</span></button>';
}
function zeileM(m) {
  return '<div class="zeile"><span><b>' + esc(m.titel) + '</b></span><span class="marke' + (m.rot ? ' rot' : '') + '">' + esc(m.stand) + '</span></div>';
}
function gruppiert(k, holen, zeile, leerText) {
  let h = '<h3 class="gruppe"><span class="ebenenwort">hier an ' + ebeneWort(k) + '</span></h3>';
  const hier = holen(k);
  h += hier.length ? '<div class="liste">' + hier.map(zeile).join('') + '</div>' : '<p class="leer">' + leerText + '</p>';
  unter(k).forEach((d) => {
    const da = holen(d);
    if (!da.length) return;
    h += '<h3 class="gruppe"><span class="ebenenwort">darunter</span><button type="button" data-akt="ebene" data-ziel="' + d + '">' + esc(relName(d, k)) + '</button></h3>' +
      '<div class="liste">' + da.map(zeile).join('') + '</div>';
  });
  return h;
}

function ebenenAnsicht(k) {
  const e = E[k];
  let kopf = '<header class="titel"><span class="ebenenmarke">' + esc(e.typ) + '</span>' +
    '<span class="augenbraue">' + (k === 'ohne' ? 'Verwaltung, Privates, alles ohne Klasse' : esc(pfad(k)) + (e.stand ? ' · ' + esc(e.stand) : '') + (e.marke ? ' · ' + esc(e.marke) : '')) + '</span>' +
    '<h1>' + esc(e.typ === 'Stunde' ? e.titel : e.name) + '</h1>';
  if (e.reihenfrage) kopf += '<p>' + (S.reihenfrage[k] ? '<b>Reihenfrage:</b> ' + esc(S.reihenfrage[k]) : '<span class="leise">Reihenfrage noch offen.</span>') + '</p>';
  else if (e.rahmen) kopf += '<p>' + esc(e.rahmen) + '</p>';
  else if (e.typ === 'Stunde') kopf += '<p class="leise">Gehört zur Reihe ' + esc(E[e.eltern].name) + '. Gespräche hier kennen auch Reihenfrage und Material der Reihe.</p>';
  kopf += '<div class="knoepfe" style="margin-top:6px"><button type="button" class="knopf knopf-voll" data-akt="neu">+ Gespräch an ' + ebeneWort(k) + '</button>' +
    (k === 'ohne' ? '' : '<button type="button" class="knopf" data-akt="ablegen">+ Datei ablegen</button><button type="button" class="knopf" data-akt="auftragleer">+ Neu aus Vorlage</button>') + '</div></header>';

  if (k === 'ohne') {
    const ids = gHier('ohne');
    return '<section class="ebene">' + kopf + '<div><h2 class="abschnitt">Gespräche</h2><div class="liste">' + ids.map((i) => zeileG(i)).join('') + '</div></div>' +
      '<p class="leise">Gespräche bleiben 30 Tage nach der letzten Nachricht, dann werden sie gelöscht.</p></section>';
  }

  const gesp = '<div><h2 class="abschnitt"><span>Gespräche</span><span class="leise">' + gAlle(k) + '</span></h2>' + gruppiert(k, (x) => gHier(x), (id) => zeileG(id), 'Noch kein Gespräch hier.') + '</div>';
  const mat = '<div><h2 class="abschnitt"><span>Material</span><span class="leise">' + mAlle(k) + '</span></h2>' + gruppiert(k, mHier, zeileM, 'Noch kein Material hier.') + '</div>';

  let darunter = '';
  if (e.kinder.length) {
    darunter = '<div class="darunter"><h2 class="abschnitt"><span>' + esc({ Klasse: 'Reihen', Kurs: 'Reihen', Reihe: 'Stunden' }[e.typ] || 'Darunter') + '</span></h2><div class="liste">' +
      e.kinder.map((c) => '<button type="button" class="zeile" data-akt="ebene" data-ziel="' + c + '"><span><b>' + esc(E[c].typ === 'Stunde' ? E[c].name : E[c].name) + '</b><small>' +
        (zahlen(gAlle(c), mAlle(c)) || 'noch leer') + (E[c].marke ? ' · ' + E[c].marke : '') + '</small></span><span class="marke">' + esc(E[c].stand || '') + '</span></button>').join('') + '</div></div>';
  } else if (e.typ === 'Kurs' || e.typ === 'Klasse') {
    darunter = '<div class="darunter"><h2 class="abschnitt">Reihen</h2><p class="leer">Noch keine Reihe. Gespräche und Material können trotzdem schon am Kurs hängen.</p></div>';
  }
  return '<section class="ebene">' + kopf + '<div class="spalten">' + gesp + mat + '</div>' + darunter + '</section>';
}

// ---------- Gespräch ----------
function nachricht(m) {
  if (m.wer === 'tag') return '<div class="tag">' + esc(m.text) + '</div>';
  if (m.wer === 'du') {
    let fotos = m.foto === 'beispiel' ? '<div class="foto">' + FOTO_BEISPIEL + '<span>Foto: Planung.heic (Beispiel)</span></div>' : '';
    (m.bilder || []).forEach((a) => { fotos += '<div class="foto">' + (a.url ? '<img src="' + a.url + '" alt="">' : '') + '<span>' + esc(a.name) + '</span></div>'; });
    return '<div class="msg du"><span class="wer">Du · ' + esc(m.zeit) + '</span>' + (m.text ? '<div class="text">' + esc(m.text) + '</div>' : '') + fotos + '</div>';
  }
  if (m.wer === 'denkt') return '<div class="msg"><span class="wer">Claude</span><span class="denkt" role="status">denkt nach … seit ' + esc(m.zeit) + '</span></div>';
  return '<div class="msg"><span class="wer">Claude · ' + esc(m.zeit) + '</span><div class="antwort">' + m.html + '</div></div>';
}

function kenntZeile(k) {
  if (k === 'ohne') return 'Dieses Gespräch hängt an keiner Ebene. Es kennt nur deine Regeln.';
  const teile = kette(k).map((x) => {
    const t = [];
    if (E[x].reihenfrage && S.reihenfrage[x]) t.push('Reihenfrage');
    if (E[x].typ === 'Reihe' && E[x].kinder.length) t.push(E[x].kinder.length + ' Stunden');
    const m = mHier(x).length; if (m) t.push(m + ' Material');
    return E[x].kurz + (t.length ? ' (' + t.join(', ') + ')' : '');
  });
  return 'Kennt: ' + teile.join(' › ') + '. Was darüber liegt, kennt es mit.';
}

function gespraechAnsicht(id) {
  const g = S.gespraeche[id];
  let kopf = '<div class="gkopf"><span class="augenbraue">Gespräch an ' + ebeneWort(g.ort) + (g.ort === 'ohne' ? '' : ' · ' + esc(E[g.ort].typ === 'Stunde' ? E[g.ort].name : E[g.ort].name)) + '</span><div class="z">';
  if (S.umbenennen) kopf += '<label class="leise" for="gname">Name</label><input id="gname" value="' + esc(g.name) + '"><button type="button" class="knopf knopf-klein" data-akt="namespeichern">Speichern</button>';
  else kopf += '<span class="gname">' + esc(g.name) + '</span><button type="button" class="knopf-leise" data-akt="umbenennen">Umbenennen</button>';
  kopf += '<button type="button" class="knopf knopf-klein" data-akt="ebene" data-ziel="' + g.ort + '">‹ Zur ' + esc(g.ort === 'ohne' ? 'Liste' : E[g.ort].typ) + '</button></div></div>';

  const verlauf = '<div class="verlauf" id="verlauf">' + (g.msgs.length ? g.msgs.map(nachricht).join('') :
    '<p class="leise">Frag einfach los, so lang du willst. Das Gespräch hängt an ' + ebeneWort(g.ort) + (g.ort === 'ohne' ? '' : ' ' + esc(E[g.ort].kurz)) + '. Den Namen schlage ich nach deiner ersten Nachricht vor.</p>') + '</div>';

  const anh = S.anhang.map((a, i) => '<span class="chip">' + (a.url ? '<img src="' + a.url + '" alt="">' : '') + esc(a.name) +
    '<button type="button" data-akt="anhangweg" data-i="' + i + '" aria-label="' + esc(a.name) + ' entfernen">weg</button></span>').join('');

  const eingabe = '<form class="eingabe" id="eingabe"><label for="text" class="leise" style="padding:10px 14px 0">Nachricht</label>' +

function zeichnen() {
  document.querySelectorAll('.leiste nav a').forEach((a) => a.toggleAttribute('aria-current', false));
  const aktiv = document.querySelector('.leiste nav a[data-seite="' + S.seite + '"]');
  if (aktiv) aktiv.setAttribute('aria-current', 'page');
  $('#wurzel').innerHTML = S.seite === 'luecken' ? seiteLuecken() : seiteSkizze();
  schicht();
}
function speichernEntwurf() { const t = $('#text'); if (t) S.entwurf = t.value; }
function ansEnde() { const v = $('#verlauf'); if (v && v.lastElementChild) v.lastElementChild.scrollIntoView({ block: 'nearest' }); }

// ---------- Handlungen ----------
function oeffnen(id) {
  speichernEntwurf();
  S.gespraech = id; S.ebene = S.gespraeche[id].ort; S.heute = false; S.umbenennen = false;
  zeichnen(); ansEnde();
}

function senden() {
  const t = ($('#text') || {}).value || '';
  if (!t.trim() && !S.anhang.length) return;
  const g = S.gespraeche[S.gespraech];
  const z = jetzt();
  const bilder = S.anhang.filter((a) => !a.beispiel);
  const beispiel = S.anhang.some((a) => a.beispiel);
  if (!g.msgs.some((m) => m.wer === 'tag' && /^Heute/.test(m.text))) g.msgs.push({ wer: 'tag', text: 'Heute' });
  g.msgs.push({ wer: 'du', zeit: z, text: t.trim(), bilder, foto: beispiel ? 'beispiel' : undefined });
  const erste = g.msgs.filter((m) => m.wer === 'du').length === 1;
  if (erste && g.name === 'Neues Gespräch' && t.trim()) g.name = t.trim().split(/\s+/).slice(0, 5).join(' ').replace(/[.,:;?!]+$/, '');
  g.zuletzt = 'heute ' + z;
  g.msgs.push({ wer: 'denkt', zeit: z });
  S.entwurf = ''; S.anhang = [];
  zeichnen(); ansEnde();
  setTimeout(() => {
    g.msgs = g.msgs.filter((m) => m.wer !== 'denkt');
    g.msgs.push({ wer: 'claude', zeit: jetzt(), html:
      '<p>' + (bilder.length || beispiel ? 'Hier würde ich zuerst sagen, was ich auf dem Foto sehe, und dann antworten. ' : '') +
      'In der Skizze antworte ich nicht wirklich. Im echten Gespräch stünde hier die Antwort, so lang wie nötig, mit Überschriften, Tabellen und Bausteinen zum Kopieren.' +
      (S.gruendlich ? ' Mit „gründlich“ dauert es länger und geht tiefer.' : '') + '</p>' +
      (erste ? '<p class="leise">Name vorgeschlagen: „' + esc(g.name) + '“. Ändern über „Umbenennen“.</p>' : '') });
    if (S.seite === 'skizze') { speichernEntwurf(); zeichnen(); }
  }, 1400);
}

function kopieren(knopf) {
  const bt = knopf.closest('.baustein').querySelector('.bt');
  const fertig = () => { knopf.textContent = 'Kopiert'; setTimeout(() => { knopf.textContent = 'Kopieren'; }, 1600); };
  const notfalls = () => { const r = document.createRange(); r.selectNodeContents(bt); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); knopf.textContent = 'Markiert, jetzt kopieren'; };
  try { navigator.clipboard.writeText(bt.textContent).then(fertig, notfalls); } catch (e) { notfalls(); }
}

function anhaengen(dateien) {
  Array.from(dateien).slice(0, 5).forEach((f) => {
    const eintrag = { name: f.name, url: '' };
    S.anhang.push(eintrag);
    if (f.type && f.type.startsWith('image/')) {
      const r = new FileReader();
      r.onload = () => { eintrag.url = r.result; speichernEntwurf(); zeichnen(); };
      r.readAsDataURL(f);
    }
  });
  speichernEntwurf(); zeichnen();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-akt]');
  if (!el) return;
  const a = el.dataset.akt;
  if (a === 'hintergrund') { if (e.target === el) { S.schicht = null; schicht(); } return; }
  switch (a) {
    case 'heute': speichernEntwurf(); S.heute = true; S.gespraech = null; S.band = ''; S.vorher = null; break;
    case 'ebene': speichernEntwurf(); S.ebene = el.dataset.ziel; S.gespraech = null; S.heute = false; S.umbenennen = false; S.band = ''; S.vorher = null; break;
    case 'oeffnen': oeffnen(el.dataset.id); return;
    case 'neu': {
      speichernEntwurf();
      const id = 'n' + Date.now();
      S.gespraeche[id] = { ort: S.ebene, name: 'Neues Gespräch', zuletzt: 'gerade eben', msgs: [] };
      S.entwurf = ''; oeffnen(id); const t = $('#text'); if (t) t.focus(); return;
    }
    case 'umbenennen': speichernEntwurf(); S.umbenennen = true; zeichnen(); { const i = $('#gname'); if (i) { i.focus(); i.select(); } } return;
    case 'namespeichern': { const v = ($('#gname') || {}).value; if (v && v.trim()) S.gespraeche[S.gespraech].name = v.trim(); S.umbenennen = false; break; }
    case 'kopieren': kopieren(el); return;
    case 'reihenfrage': {
      speichernEntwurf();
      const r = reiheVon(S.gespraeche[S.gespraech].ort) || 'strafe';
      S.vorher = { r, alt: S.reihenfrage[r] || '' };
      S.reihenfrage[r] = el.closest('.baustein').querySelector('.bt').textContent;
      S.band = 'Als Reihenfrage von ' + esc(E[r].name) + ' übernommen.';
      break;
    }
    case 'rueckgaengig': if (S.vorher) S.reihenfrage[S.vorher.r] = S.vorher.alt; S.vorher = null; S.band = 'Zurückgenommen: Reihenfrage wie vorher.'; break;
    case 'bandzu': S.band = ''; break;
    case 'beispielfoto': speichernEntwurf(); S.anhang.push({ name: 'Planung.heic (Beispiel)', beispiel: true }); break;
    case 'anhangweg': speichernEntwurf(); S.anhang.splice(Number(el.dataset.i), 1); break;
    case 'bisher': {
      speichernEntwurf();
      const g = S.gespraeche[S.gespraech];
      g.msgs.push({ wer: 'claude', zeit: jetzt(), html: '<h3>Was wir bisher haben</h3><ul>' + (S.gespraech === 'g1' ?
        '<li><b>Gewählt:</b> Reihenfrage mit Gefängnis-Bezug' + (S.reihenfrage.strafe ? ' (übernommen)' : ' (noch nicht übernommen)') + '</li><li><b>Verworfen:</b> „Wozu sperren wir Menschen ein?“, zu offen; die Fassung mit „gerecht oder besser“ war für Klasse 8 zu abstrakt</li><li><b>Offen:</b> Fall für Stunde 4</li>'
        : '<li>Hier stünde eine kurze Zusammenfassung: was gewählt, was verworfen, was offen ist.</li>') + '</ul>' });
      zeichnen(); ansEnde(); return;
    }
    case 'auftrag': case 'auftragleer': case 'verschieben': speichernEntwurf(); S.schicht = a; schicht(); return;
    case 'ablegen': speichernEntwurf(); S.schicht = 'ablegen'; S.ablegenDatei = ''; schicht(); return;
    case 'beispieldatei': S.ablegenDatei = 'Bewertungskriterien.pdf'; schicht(); return;
    case 'ablegenok': {
      const ziel = ($('#gilt') || {}).value || S.ebene;
      S.material.push({ ort: ziel, titel: S.ablegenDatei, stand: 'deine Datei' });
      S.schicht = null; S.vorher = null;
      S.band = 'Abgelegt an ' + esc(pfad(ziel)) + ': ' + esc(S.ablegenDatei) + '. Gespräche dort und darunter kennen die Datei jetzt.';
      break;
    }
    case 'verschiebenok': {
      const ziel = ($('#wohin') || {}).value;
      if (S.gespraech && ziel) { S.gespraeche[S.gespraech].ort = ziel; S.ebene = ziel; }
      S.schicht = null; S.vorher = null; S.band = 'Umgehängt an ' + esc(pfad(ziel)) + '.';
      break;
    }
    case 'abschicken': S.schicht = null; S.vorher = null; S.band = 'In der echten App würde der Auftrag jetzt starten und unter „Läuft gerade“ stehen. Die Skizze schickt nichts ab.'; break;
    case 'schliessen': S.schicht = null; schicht(); return;
    default: return;
  }
  zeichnen();
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'foto') anhaengen(e.target.files);
  else if (e.target.id === 'gruendlich') S.gruendlich = e.target.checked;
  else if (e.target.id === 'netz') S.netz = e.target.checked;
  else if (e.target.id === 'ablegedatei' && e.target.files[0]) { S.ablegenDatei = e.target.files[0].name; schicht(); }
});
document.addEventListener('submit', (e) => { if (e.target.id === 'eingabe') { e.preventDefault(); senden(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.schicht) { S.schicht = null; schicht(); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'text') { e.preventDefault(); senden(); }
});
document.addEventListener('paste', (e) => {
  if (e.target.id !== 'text' || !e.clipboardData) return;
  const bilder = Array.from(e.clipboardData.files || []).filter((f) => f.type.startsWith('image/'));
  if (bilder.length) { e.preventDefault(); anhaengen(bilder); }
});
$('#zuruecksetzen').addEventListener('click', () => { const seite = S.seite; S = frische(); S.seite = seite; zeichnen(); });

function nachHash() {
  const h = location.hash.replace('#', '');
  speichernEntwurf();
  S.seite = (h === 'skizze' || h === 'variante-a' || h === 'variante-b') ? 'skizze' : 'luecken';
  S.band = ''; S.vorher = null;
  zeichnen();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', nachHash);
nachHash();
})();
</script>
