<title>Skizze Gespräch für Lia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Inter+Tight:wght@600;800&display=swap">
<style>
/* Modernist wie lia.meldro.de: schwarz auf weiß, harte Linien, ein Rot nur für "wartet auf dich".
   Aufbau: Leiste der Skizze oben, darunter die App mit drei Spalten Baum | Mitte | rechts. */
:root {
  --bg: #ffffff; --fg: #111111; --leise: #5c5c5c; --flaeche: #f4f4f2; --baum: #fafafa;
  --linie: #111111; --duenn: #d6d6d2; --akzent: #d4290f; --fokus: #1f4fd1; --umkehr: #ffffff;
  --skizze: #fff4c2;
  --schrift: Inter, "Helvetica Neue", Arial, sans-serif;
  --titel: "Inter Tight", Inter, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141414; --fg: #f2f2ef; --leise: #a9a9a3; --flaeche: #222221; --baum: #1a1a1a;
  --linie: #f2f2ef; --duenn: #3a3a38; --akzent: #ff6a4d; --fokus: #8fb0ff; --umkehr: #141414;
  --skizze: #3b3517; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141414; --fg: #f2f2ef; --leise: #a9a9a3; --flaeche: #222221; --baum: #1a1a1a;
  --linie: #f2f2ef; --duenn: #3a3a38; --akzent: #ff6a4d; --fokus: #8fb0ff; --umkehr: #141414;
  --skizze: #3b3517; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--schrift); font-size: 15px; line-height: 1.5; margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--fokus); outline-offset: 2px }
h1, h2, h3 { text-wrap: balance }

/* Leiste der Skizze */
.leiste { background: var(--skizze); border-bottom: 3px solid var(--linie);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center }
.leiste strong { font-family: var(--titel); font-size: 18px; font-weight: 800; letter-spacing: -.01em }
.leiste nav { display: flex; flex-wrap: wrap; gap: 0 }
.leiste nav a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 2px solid var(--linie); margin-right: -2px;
  color: var(--fg); text-decoration: none; font-weight: 700; background: var(--bg) }
.leiste nav a[aria-current="page"] { background: var(--fg); color: var(--umkehr) }
.leiste .hinweis { font-size: 13px; color: var(--fg); flex: 1 1 260px }
.leiste .zurueck { border: 0; background: none; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; padding: 8px 0 }

/* App */
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr) 320px; min-height: calc(100vh - 64px) }
.app.ohne-rechts { grid-template-columns: 260px minmax(0, 1fr) }
.baum { background: var(--baum); border-right: 3px solid var(--linie); padding: 20px 12px 32px; display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.baum .name { padding: 0 10px 14px; font-family: var(--titel); font-size: 22px; font-weight: 800; letter-spacing: -.02em }
.baum .kopf { padding: 16px 10px 4px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--leise) }
.baum button { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 36px;
  padding: 6px 10px; border: 0; background: transparent; text-align: left; font-weight: 500 }
.baum button.e1 { padding-left: 26px; font-weight: 400 }
.baum button.e2 { padding-left: 42px; font-weight: 400; font-size: 14px; color: var(--leise) }
.baum button[aria-current="location"] { background: var(--fg); color: var(--umkehr); font-weight: 700 }
.baum .zahl { font-size: 12px; font-weight: 700; color: var(--akzent) }
.baum button[aria-current="location"] .zahl { color: var(--umkehr) }

main { min-width: 0; padding: 20px 40px 48px; display: flex; flex-direction: column; gap: 20px }
.oben { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; min-height: 40px }
.krumen { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--leise) }
.krumen b { color: var(--fg) }
.hinweisband { margin: 0; padding: 12px 16px; border: 2px solid var(--linie); font-weight: 500; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5 }

.knopf { min-height: 40px; padding: 0 14px; border: 2px solid var(--linie); background: var(--bg); font-weight: 700; display: inline-flex; align-items: center; gap: 6px }
.knopf-voll { background: var(--fg); color: var(--umkehr) }
.knopf-klein { min-height: 32px; padding: 0 10px; font-size: 14px; border-width: 1px }
.knopf-leise { border: 0; background: none; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; padding: 0 4px; min-height: 32px }

.titel { border-bottom: 3px solid var(--linie); padding-bottom: 12px; display: flex; flex-direction: column; gap: 4px }
.augenbraue { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--leise) }
.titel h1 { margin: 0; font-family: var(--titel); font-size: 40px; font-weight: 800; line-height: 1.05; letter-spacing: -.03em }
.titel p { margin: 0 }

/* Gespräch */
.gespraech { max-width: 840px; width: 100%; display: flex; flex-direction: column; gap: 18px }
.gkopf { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; border-bottom: 3px solid var(--linie); padding-bottom: 10px }
.gkopf select { min-height: 40px; border: 2px solid var(--linie); background: var(--bg); font-weight: 700; padding: 0 8px; max-width: 100% }
.gkopf .gname { font-family: var(--titel); font-size: 22px; font-weight: 800; letter-spacing: -.02em; flex: 1 1 auto }
.gkopf input { min-height: 40px; border: 2px solid var(--linie); padding: 0 8px; font-weight: 700; flex: 1 1 220px; background: var(--bg) }
.verlauf { display: flex; flex-direction: column; gap: 22px }
.tag { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--leise) }
.tag::before, .tag::after { content: ""; flex: 1; border-top: 1px solid var(--duenn) }
.msg { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.msg .wer { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--leise) }
.msg.du .text { background: var(--flaeche); padding: 12px 16px; max-width: 640px; white-space: pre-wrap }
.msg.du { align-items: flex-end }
.msg.du .wer { text-align: right }
.antwort { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.antwort h3 { margin: 8px 0 0; font-size: 16px; font-weight: 700 }
.antwort p, .antwort ul { margin: 0 }
.antwort ul { padding-left: 20px }
.tabelle { overflow-x: auto; max-width: 100% }
.tabelle table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px }
.tabelle th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; border-bottom: 2px solid var(--linie); padding: 8px 10px 6px 0 }
.tabelle td { border-bottom: 1px solid var(--duenn); padding: 8px 10px 8px 0; vertical-align: top }
.baustein { border: 2px solid var(--linie); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px }
.baustein .bk { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap }
.baustein .bt { font-size: 18px; font-weight: 700; line-height: 1.35 }
.baustein .bf { display: flex; flex-wrap: wrap; gap: 8px }
.foto { width: 220px; max-width: 100%; border: 1px solid var(--linie); background: var(--bg) }
.foto img, .foto svg { display: block; width: 100%; height: auto }
.foto span { display: block; font-size: 12px; padding: 4px 8px; border-top: 1px solid var(--linie); color: var(--leise) }
.denkt { font-size: 14px; color: var(--leise) }

.eingabe { border: 2px solid var(--linie); display: flex; flex-direction: column; position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--bg) }
.eingabe textarea { border: 0; resize: vertical; min-height: 96px; padding: 12px 14px; background: var(--bg) }
.eingabe .anh { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px }
.eingabe .anh:empty { display: none }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linie); padding: 2px 4px 2px 2px; font-size: 13px; max-width: 100% }
.chip img { width: 40px; height: 40px; object-fit: cover; display: block }
.chip button { border: 0; background: none; min-height: 28px; padding: 0 4px; text-decoration: underline }
.eingabe .leiste2 { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 8px 10px; border-top: 1px solid var(--duenn) }
.eingabe .links, .eingabe .rechts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center }
.eingabe label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px }
.kennt { font-size: 13px; color: var(--leise) }
.datei-knopf { position: relative; overflow: hidden }
.datei-knopf input { position: absolute; inset: 0; opacity: 0; cursor: pointer }

/* Listen */
.liste { display: flex; flex-direction: column }
.liste .zeile { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; border: 0; border-top: 1px solid var(--linie); background: none; text-align: left; width: 100% }
.liste .zeile:last-child { border-bottom: 1px solid var(--linie) }
.liste .zeile b { display: block; font-size: 17px }
.liste .zeile small { font-size: 13px; color: var(--leise) }
.liste .marke { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; align-self: center }
.rot { color: var(--akzent) }
h2.abschnitt { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase }

/* Rechte Spalte */
aside.rechts { border-left: 3px solid var(--linie); padding: 20px 18px 32px; display: flex; flex-direction: column; gap: 22px; min-width: 0 }
aside.rechts h2 { margin: 0; font-family: var(--titel); font-size: 22px; font-weight: 800; letter-spacing: -.02em }
aside .block { display: flex; flex-direction: column; gap: 6px }
aside .block ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
aside .block li { border-top: 1px solid var(--duenn); padding: 6px 0; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
aside .block li button.link { border: 0; background: none; padding: 0; text-align: left; text-decoration: underline; text-underline-offset: 3px; font-weight: 500 }
aside .block li[aria-current="true"] button.link { font-weight: 700; text-decoration: none }
aside .rf { font-size: 15px; font-weight: 700 }
aside small, .leise { color: var(--leise); font-size: 13px }
.altchat { display: flex; flex-direction: column; gap: 10px; font-size: 14px }
.altchat textarea { min-height: 64px; border: 2px solid var(--linie); padding: 8px; background: var(--bg); resize: vertical }
.altchat .f { background: var(--flaeche); padding: 8px 10px }

/* Reiter (Variante B) */
.reiter { display: flex; gap: 0; border-bottom: 3px solid var(--linie) }
.reiter button { min-height: 44px; padding: 0 18px; border: 2px solid var(--linie); border-bottom: 0; margin-right: -2px; background: var(--bg); font-weight: 700 }
.reiter button[aria-selected="true"] { background: var(--fg); color: var(--umkehr) }

/* Überlagerung */
.schicht { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; justify-content: center; align-items: flex-start; padding: 48px 16px; overflow-y: auto; z-index: 20 }
.fenster { background: var(--bg); border: 3px solid var(--linie); width: 100%; max-width: 720px; padding: 24px; display: flex; flex-direction: column; gap: 14px }
.fenster h2 { margin: 0; font-family: var(--titel); font-size: 28px; font-weight: 800; letter-spacing: -.02em }
.fenster label { font-weight: 700; display: flex; flex-direction: column; gap: 6px }
.fenster textarea, .fenster select { border: 2px solid var(--linie); padding: 10px; background: var(--bg); font-weight: 400 }
.fenster textarea { min-height: 220px; resize: vertical }
.fenster .reihe { display: flex; flex-wrap: wrap; gap: 10px }
.ablegefeld { border: 2px dashed var(--linie); padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center }

/* Lückenliste */
.luecken { max-width: 900px; margin: 0 auto; padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px }
.luecken h1 { margin: 0; font-family: var(--titel); font-size: 48px; font-weight: 800; line-height: 1; letter-spacing: -.035em }
.luecken .zahlen { display: flex; flex-wrap: wrap; gap: 0; border-top: 3px solid var(--linie); border-bottom: 3px solid var(--linie) }
.luecken .zahlen div { flex: 1 1 180px; padding: 14px 16px 14px 0 }
.luecken .zahlen b { display: block; font-family: var(--titel); font-size: 40px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1 }
.lz { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 0; border-top: 1px solid var(--linie); align-items: start }
.lz .n { font-family: var(--titel); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right }
.lz .balken { grid-column: 2; height: 6px; background: var(--duenn) }
.lz .balken i { display: block; height: 100%; background: var(--fg) }
.lz b { font-size: 17px }
.lz p { margin: 2px 0 0; color: var(--leise); font-size: 14px }
.lz .wo { font-size: 13px; white-space: nowrap }
.lz .wo a { color: var(--fg) }
.frage { border: 3px solid var(--linie); padding: 20px 24px; font-family: var(--titel); font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05 }
.frage small { display: block; font-family: var(--schrift); font-size: 15px; font-weight: 400; letter-spacing: 0; margin-top: 10px }

@media (max-width: 1100px) {
  .app, .app.ohne-rechts { grid-template-columns: 240px minmax(0, 1fr) }
  aside.rechts { grid-column: 2; border-left: 0; border-top: 3px solid var(--linie); padding-left: 40px; padding-right: 40px }
}
@media (max-width: 760px) {
  .app, .app.ohne-rechts { grid-template-columns: minmax(0, 1fr) }
  .baum { border-right: 0; border-bottom: 3px solid var(--linie) }
  aside.rechts { grid-column: 1; padding-left: 16px; padding-right: 16px }
  main { padding: 16px 16px 40px }
  .titel h1, .luecken h1 { font-size: 32px }
  .frage { font-size: 28px }
  .lz { grid-template-columns: 40px minmax(0, 1fr) }
  .lz .wo { grid-column: 2 }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<div class="leiste">
  <strong>Skizze: Gespräch in der Mitte</strong>
  <nav aria-label="Teile der Skizze">
    <a href="#luecken" data-seite="luecken">1 Was fehlt</a>
    <a href="#variante-a" data-seite="a">2 Variante A</a>
    <a href="#variante-b" data-seite="b">3 Variante B</a>
  </nav>
  <span class="hinweis">Nur ein Bild zum Klicken. Niemand antwortet wirklich, nichts wird gespeichert oder verschickt. Alle Texte sind Beispiele.</span>
  <button type="button" class="zurueck" id="zuruecksetzen">Skizze zurücksetzen</button>
</div>
<div id="wurzel"></div>
<div id="schicht"></div>

<script>
(function () {
'use strict';

// ---------- Daten (Beispiele, Orte wie in Lias App) ----------
const ORTE = {

const FOTO_BEISPIEL = '<svg viewBox="0 0 220 160" role="img" aria-label="Beispielfoto: handschriftliche Planung auf kariertem Papier"><rect width="220" height="160" fill="#f7f3e8"/><g stroke="#d9d3c2" stroke-width="1">' +

function frische() {

    gespraeche: {
      g1: { ort: 'strafe', name: 'Reihenfrage finden', zuletzt: 'heute 09:12', msgs: GESPRAECH_REIHENFRAGE() },
      g2: { ort: 'strafe', name: 'Stunde 3: Einstieg mit einem Fall', zuletzt: 'Fr 06.11.', msgs: [

const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- Gespräch ----------
function nachricht(m) {
  if (m.wer === 'tag') return '<div class="tag">' + esc(m.text) + '</div>';
  if (m.wer === 'du') {
    let fotos = '';
    if (m.foto === 'beispiel') fotos = '<div class="foto">' + FOTO_BEISPIEL + '<span>Foto: Planung.heic (Beispiel)</span></div>';
    (m.bilder || []).forEach((a) => { fotos += '<div class="foto">' + (a.url ? '<img src="' + a.url + '" alt="">' : '') + '<span>' + esc(a.name) + '</span></div>'; });
    return '<div class="msg du"><span class="wer">Du · ' + esc(m.zeit) + '</span>' + (m.text ? '<div class="text">' + esc(m.text) + '</div>' : '') + fotos + '</div>';
  }
  if (m.wer === 'denkt') return '<div class="msg"><span class="wer">Claude</span><span class="denkt" role="status">denkt nach … seit ' + esc(m.zeit) + '</span></div>';
  return '<div class="msg"><span class="wer">Claude · ' + esc(m.zeit) + '</span><div class="antwort">' + m.html + '</div></div>';
}

function kenntZeile(k) {
  const o = ORTE[k];
  if (k === 'ohne') return 'Dieses Gespräch hat keinen Ort. Es kennt nur deine Regeln.';
  const t = [];
  if (o.reihe) t.push((S.reihenfrage[k] ? 'Reihenfrage' : 'Reihenfrage offen'));
  if (o.stunden.length) t.push(o.stunden.length + ' Stunden');
  if (o.material.length) t.push(o.material.length + ' Material');
  const d = (S.dateien[k] || []).length;
  if (d) t.push(d + ' eigene ' + (d === 1 ? 'Datei' : 'Dateien'));
  return 'Kennt: ' + ortPfad(k) + (t.length ? ' · ' + t.join(', ') : '');
}

function gespraechAnsicht(id, mitAuswahl) {
  const g = S.gespraeche[id];

    kopf += '<label class="leise" for="gname">Name</label><input id="gname" value="' + esc(g.name) + '"><button type="button" class="knopf knopf-klein" data-akt="namespeichern">Speichern</button>';
  } else {
    if (mitAuswahl && ids.length > 1) {
      kopf += '<label class="leise" for="gwahl">Gespräch</label><select id="gwahl" data-akt="wahl">' +
        ids.map((i) => '<option value="' + i + '"' + (i === id ? ' selected' : '') + '>' + esc(S.gespraeche[i].name) + '</option>').join('') + '</select>';
    } else {
      kopf += '<span class="gname">' + esc(g.name) + '</span>';

  const verlauf = '<div class="verlauf" id="verlauf">' + (g.msgs.length ? g.msgs.map(nachricht).join('') :
    '<p class="leise">Frag einfach los, so lang du willst. Den Namen schlage ich nach deiner ersten Nachricht vor, du kannst ihn ändern.</p>') + '</div>';

  const anh = S.anhang.map((a, i) => '<span class="chip">' + (a.url ? '<img src="' + a.url + '" alt="">' : '') + esc(a.name) +
    '<button type="button" data-akt="anhangweg" data-i="' + i + '" aria-label="' + esc(a.name) + ' entfernen">weg</button></span>').join('');

  const eingabe = '<form class="eingabe" id="eingabe"><label for="text" class="leise" style="padding:10px 14px 0">Nachricht</label>' +
    '<textarea id="text" placeholder="Schreib oder füge einen langen Text ein. Keine Namen von Schüler*innen.">' + esc(S.entwurf) + '</textarea>' +
    '<div class="anh">' + anh + '</div>' +
    '<div class="leiste2"><div class="links">' +
    '<span class="knopf knopf-klein datei-knopf">Foto oder Datei<input type="file" id="foto" accept="image/*,.heic,.pdf,.docx,.pptx" multiple aria-label="Foto oder Datei anhängen"></span>' +
    '<button type="button" class="knopf-leise" data-akt="beispielfoto">Beispielfoto nehmen</button>' +
    '<label class="check"><input type="checkbox" id="gruendlich"' + (S.gruendlich ? ' checked' : '') + '> gründlich</label>' +
    '<label class="check"><input type="checkbox" id="netz"' + (S.netz ? ' checked' : '') + '> Im Netz nachsehen</label></div>' +
    '<div class="rechts"><button type="button" class="knopf-leise" data-akt="bisher">Was haben wir bisher?</button>' +
    '<button type="button" class="knopf knopf-klein" data-akt="auftrag">Daraus Auftrag machen</button>' +
    '<button type="submit" class="knopf knopf-voll">Senden</button></div></div></form>' +
    '<p class="kennt">' + esc(kenntZeile(g.ort)) + '</p>';

  return '<section class="gespraech" aria-label="Gespräch">' + kopf + verlauf + eingabe + '</section>';
}

  const ids = gespraecheAm(k);

      return '<button type="button" class="zeile" data-akt="oeffnen" data-id="' + i + '"><span><b>' + esc(g.name) + '</b><small>' + n + ' Nachrichten · zuletzt ' + esc(g.zuletzt) + '</small></span><span class="marke">öffnen</span></button>';
    }).join('') + '</div>' : '<p class="leise">Noch kein Gespräch hier.</p>') +
    '<p class="leise">Gespräche bleiben 30 Tage nach der letzten Nachricht, dann werden sie gelöscht. Du kannst eines auch vorher löschen.</p></section>';

function uebersicht(k, mitDateien) {
  const o = ORTE[k];
  const rf = S.reihenfrage[k];
  let h = '<section class="gespraech"><header class="titel"><span class="augenbraue">' + esc(o.art) + ' · ' + esc(o.stand) + '</span><h1>' + esc(o.titel) + '</h1>' +

  if (o.material.length) h += '<div><h2 class="abschnitt">Material</h2><div class="liste">' + o.material.map((m) =>
    '<div class="zeile"><span><b>' + esc(m[0]) + '</b></span><span class="marke' + (m[2] ? ' rot' : '') + '">' + esc(m[1]) + '</span></div>').join('') + '</div></div>';
  if (o.stunden.length) h += '<div><h2 class="abschnitt">Stunden</h2><div class="liste">' + o.stunden.map((s, i) =>

function eigeneDateien(k, gross) {
  const d = S.dateien[k] || [];

    '</ul><div><button type="button" class="knopf knopf-klein" data-akt="ablegen">+ Datei ablegen</button></div><small>Gespräche hier kennen diese Dateien. Keine Schülerdaten.</small></div>';

// ---------- Rechte Spalte ----------
function rechtsA(k) {
  const o = ORTE[k];
  const ids = gespraecheAm(k);
  let h = '<aside class="rechts" aria-label="An diesem Ort"><h2>An diesem Ort</h2>';
  if (k === 'ohne') return h + '<p class="leise">Gespräche ohne Ort kennen keine Reihe. Wenn ein Gespräch doch zu einer Reihe gehört, kannst du es dorthin verschieben.</p><button type="button" class="knopf knopf-klein" data-akt="verschieben">An einen Ort hängen</button></aside>';
  if (o.reihe && !o.rahmen) {
    const rf = S.reihenfrage[k];
    h += '<div class="block"><h2 class="abschnitt">Reihenfrage</h2><p class="rf" style="margin:0">' + (rf ? esc(rf) : '<span class="leise">noch offen</span>') + '</p><div><button type="button" class="knopf-leise" data-akt="rfaendern">ändern</button></div></div>';
  } else if (o.rahmen) {
    h += '<div class="block"><h2 class="abschnitt">Rahmen</h2><p style="margin:0">' + esc(o.rahmen) + '</p></div>';
  }
  h += '<div class="block"><h2 class="abschnitt">Gespräche (' + ids.length + ')</h2><ul>' + ids.map((i) =>
    '<li' + (S.ansicht === 'gespraech' && S.gespraech === i ? ' aria-current="true"' : '') + '><button type="button" class="link" data-akt="oeffnen" data-id="' + i + '">' + esc(S.gespraeche[i].name) + '</button><small>' + esc(S.gespraeche[i].zuletzt.split(' ')[0]) + '</small></li>').join('') +
    '</ul><div><button type="button" class="knopf knopf-klein" data-akt="neu">+ Gespräch</button></div></div>';
  if (o.material.length) h += '<div class="block"><h2 class="abschnitt">Material</h2><ul>' + o.material.map((m) => '<li><span>' + esc(m[0]) + '</span><small' + (m[2] ? ' class="rot"' : '') + '>' + esc(m[1].split(' · ').pop()) + '</small></li>').join('') + '</ul><div><button type="button" class="knopf-leise" data-akt="uebersicht">Übersicht der ' + esc(o.art === 'Reihe' ? 'Reihe' : o.art) + ' öffnen</button></div></div>';

function rechtsB(k) {

    '<div><button type="button" class="knopf knopf-klein knopf-voll" data-akt="altfragen">Fragen</button></div>' +
    '<small>Wie heute: kurz, merkt sich nur die letzten Fragen. Für längere Gespräche: Reiter „Gespräche“.</small></div></aside>';

function krumen(k) {
  if (S.ansicht === 'heute') return '<nav class="krumen" aria-label="Brotkrumen"><b>Heute</b></nav>';
  const o = ORTE[k];
  return '<nav class="krumen" aria-label="Brotkrumen">' + (k === 'ohne' ? '<b>Gespräche ohne Ort</b>' : o.pfad.map((p) => '<span>' + esc(p) + ' ›</span>').join('') + '<b>' + esc(o.titel) + '</b>') + '</nav>';
}

function band() {
  if (!S.band) return '';
  return '<p class="hinweisband" role="status"><span>' + S.band + '</span>' + (S.vorher !== null ? '<button type="button" class="knopf knopf-klein" data-akt="rueckgaengig">Rückgängig</button>' : '<button type="button" class="knopf-leise" data-akt="bandzu">Schließen</button>') + '</p>';
}

function seiteA() {
  const k = S.ort;
  let mitte;
  if (S.ansicht === 'heute') mitte = heute();
  else if (S.ansicht === 'liste') mitte = listeAnsicht(k);
  else if (S.ansicht === 'uebersicht') mitte = '<div><button type="button" class="knopf knopf-klein" data-akt="zurueckgespraech">‹ Zurück zum Gespräch</button></div>' + uebersicht(k, true);
  else mitte = gespraechAnsicht(S.gespraech, true);
  const rechts = S.ansicht === 'heute' ? '' : rechtsA(k);
  return '<div class="app' + (rechts ? '' : ' ohne-rechts') + '">' + baum() + '<main>' +
    '<div class="oben">' + krumen(k) + '</div>' + band() + mitte + '</main>' + rechts + '</div>';
}

function seiteB() {
  const k = S.ort;
  let mitte;
  if (S.ansicht === 'heute') mitte = heute();
  else if (k === 'ohne') mitte = S.ansicht === 'gespraech' ? gespraechAnsicht(S.gespraech, false) : listeAnsicht(k);
  else {
    const o = ORTE[k];
    const n = gespraecheAm(k).length;
    mitte = '<div class="reiter" role="tablist"><button type="button" role="tab" data-akt="reiter" data-r="uebersicht" aria-selected="' + (S.reiterB === 'uebersicht') + '">Übersicht</button>' +
      '<button type="button" role="tab" data-akt="reiter" data-r="gespraeche" aria-selected="' + (S.reiterB === 'gespraeche') + '">Gespräche (' + n + ')</button></div>';
    if (S.reiterB === 'uebersicht') mitte += uebersicht(k, true);
    else if (S.bOffen && S.ansicht === 'gespraech') mitte += gespraechAnsicht(S.gespraech, false);
    else mitte += listeAnsicht(k);
    void o;
  }
  return '<div class="app">' + baum() + '<main><div class="oben">' + krumen(k) + '</div>' + band() + mitte + '</main>' + rechtsB(k) + '</div>';
}

// ---------- Überlagerungen ----------
function schicht() {
  const w = $('#schicht');
  if (!S.schicht) { w.innerHTML = ''; return; }
  const k = S.gespraeche[S.gespraech] ? S.gespraeche[S.gespraech].ort : S.ort;
  let h = '';
  if (S.schicht === 'auftrag') {
    const rf = S.reihenfrage.strafe || 'Muss jemand ins Gefängnis, auch wenn danach niemand mehr in Gefahr ist?';
    const text = k === 'strafe' ?
      'Reihenentwurf für die Reihe Straftheorien, Klasse 8.\n\nEntschieden:\n- Reihenfrage: „' + rf + '“\n- erst Kant (Vergeltung), dann von Liszt (Wozu strafen?)\n- fünf Stunden wie auf dem Foto meiner Planung, Stunde 5 ist die Prüfungsstunde\n- Merksatz von Liszt für Stunde 4 aus dem Gespräch\n\nVerworfen:\n- „Wozu sperren wir Menschen ein?“ (zu offen)\n\nWunsch:\n- Einstieg über einen Fall aus dem Schulalltag'
      : 'Aus dem Gespräch „' + S.gespraeche[S.gespraech].name + '“:\n\nEntschieden:\n- …\n\nWunsch:\n- …';
    h = '<div class="fenster" role="dialog" aria-modal="true" aria-labelledby="ftitel"><span class="augenbraue">Neu aus dem Gespräch</span><h2 id="ftitel">Daraus Auftrag machen</h2>' +
      '<p style="margin:0">Ich habe das Gespräch zu einem Auftrag geordnet. Ändere, was nicht stimmt. Erst „Abschicken“ startet etwas.</p>' +
      '<label for="vorlage">Vorlage<select id="vorlage"><option>Reihenentwurf</option><option>Arbeitsblatt</option><option>Präsentation</option><option>Lernerfolgskontrolle</option></select></label>' +
      '<p style="margin:0"><b>Ort:</b> ' + esc(ortPfad(k)) + (k === 'strafe' ? ' · ganze Reihe' : '') + '</p>' +
      '<label for="atext">Was soll entstehen?<textarea id="atext">' + esc(text) + '</textarea></label>' +
      '<p class="leise" style="margin:0">Das Gespräch geht als Grundlage mit. Keine Namen von Schüler*innen.</p>' +
      '<div class="reihe"><button type="button" class="knopf knopf-voll" data-akt="abschicken">Abschicken</button><button type="button" class="knopf" data-akt="schliessen">Abbrechen</button></div></div>';
  } else if (S.schicht === 'ablegen') {
    const o = ORTE[k];
    h = '<div class="fenster" role="dialog" aria-modal="true" aria-labelledby="ftitel"><span class="augenbraue">' + esc(ortPfad(k)) + '</span><h2 id="ftitel">Eigene Datei ablegen</h2>' +
      '<p style="margin:0">Die Datei bleibt hier liegen. Jedes Gespräch an diesem Ort kennt sie, du musst sie nicht neu hochladen.</p>' +
      '<label for="gilt">Gehört zu<select id="gilt"><option>ganze ' + esc(o.art) + '</option>' + o.stunden.map((s, i) => '<option>Stunde ' + (i + 1) + '</option>').join('') + '</select></label>' +
      '<div class="ablegefeld"><span class="knopf datei-knopf">Datei wählen<input type="file" id="ablegedatei" aria-label="Datei wählen"></span><span class="leise">Word, PDF, PowerPoint, Foto</span>' +
      (S.ablegenDatei ? '<b>' + esc(S.ablegenDatei) + '</b>' : '<button type="button" class="knopf-leise" data-akt="beispieldatei">oder Beispiel nehmen: Bewertungskriterien.pdf</button>') + '</div>' +
      '<p style="margin:0"><b>Keine Schülerdaten:</b> keine Namen, Noten oder Fotos von Arbeiten mit Namen.</p>' +
      '<div class="reihe"><button type="button" class="knopf knopf-voll" data-akt="ablegenok"' + (S.ablegenDatei ? '' : ' disabled') + '>Ablegen</button><button type="button" class="knopf" data-akt="schliessen">Abbrechen</button></div></div>';
  } else if (S.schicht === 'verschieben') {
    h = '<div class="fenster" role="dialog" aria-modal="true" aria-labelledby="ftitel"><h2 id="ftitel">An einen Ort hängen</h2><p style="margin:0">In der Skizze nur angedeutet: Hier wählst du Fach, Klasse und Reihe. Das Gespräch kennt danach alles, was an diesem Ort liegt.</p>' +
      '<label for="wohin">Ort<select id="wohin"><option>Ethik › 8 › Straftheorien</option><option>Ethik › 8 › Helfen</option><option>Darstellendes Spiel › Kurs 11 · 2026/27</option><option>Darstellendes Spiel › Kurs 12 › Der nackte Wahnsinn</option></select></label>' +
      '<div class="reihe"><button type="button" class="knopf" data-akt="schliessen">Schließen</button></div></div>';
  }
  w.innerHTML = '<div class="schicht" data-akt="hintergrund">' + h + '</div>';
  const erstes = w.querySelector('textarea, select, button');
  if (erstes) erstes.focus();
}

// ---------- Zeichnen ----------
function zeichnen() {
  document.querySelectorAll('.leiste nav a').forEach((a) => a.toggleAttribute('aria-current', false));
  const aktiv = document.querySelector('.leiste nav a[data-seite="' + S.seite + '"]');
  if (aktiv) aktiv.setAttribute('aria-current', 'page');
  const w = $('#wurzel');
  w.innerHTML = S.seite === 'luecken' ? seiteLuecken() : S.seite === 'a' ? seiteA() : seiteB();
  schicht();
}

function speichernEntwurf() { const t = $('#text'); if (t) S.entwurf = t.value; }

// ---------- Handlungen ----------
function oeffnen(id) {
  speichernEntwurf();
  S.gespraech = id; S.ort = S.gespraeche[id].ort; S.ansicht = 'gespraech'; S.umbenennen = false; S.reiterB = 'gespraeche'; S.bOffen = true;
  zeichnen();
  const v = $('#verlauf'); if (v && v.lastElementChild) v.lastElementChild.scrollIntoView({ block: 'nearest' });
}

function senden() {
  const t = ($('#text') || {}).value || '';
  if (!t.trim() && !S.anhang.length) return;
  const g = S.gespraeche[S.gespraech];
  const z = jetzt();
  const bilder = S.anhang.filter((a) => !a.beispiel);
  const beispiel = S.anhang.some((a) => a.beispiel);
  if (!g.msgs.some((m) => m.text === 'Heute, Montag 09.11.' || m.text === 'Heute')) g.msgs.push({ wer: 'tag', text: 'Heute' });
  g.msgs.push({ wer: 'du', zeit: z, text: t.trim(), bilder, foto: beispiel ? 'beispiel' : undefined });
  const erste = g.msgs.filter((m) => m.wer === 'du').length === 1;
  if (erste && g.name === 'Neues Gespräch' && t.trim()) g.name = t.trim().split(/\s+/).slice(0, 5).join(' ').replace(/[.,:;?!]+$/, '');
  g.zuletzt = 'heute ' + z;
  g.msgs.push({ wer: 'denkt', zeit: z });
  S.entwurf = ''; S.anhang = [];
  zeichnen();
  const v = $('#verlauf'); if (v) v.lastElementChild.scrollIntoView({ block: 'nearest' });
  setTimeout(() => {
    g.msgs = g.msgs.filter((m) => m.wer !== 'denkt');
    const mitFoto = bilder.length || beispiel;
    g.msgs.push({ wer: 'claude', zeit: jetzt(), html:
      '<p>' + (mitFoto ? 'Hier würde ich zuerst sagen, was ich auf dem Foto sehe, und dann antworten. ' : '') +
      'In der Skizze antworte ich nicht wirklich. Im echten Gespräch stünde hier die Antwort, so lang wie nötig, mit Überschriften, Tabellen und Bausteinen zum Kopieren.' +
      (S.gruendlich ? ' Mit „gründlich“ dauert es länger und geht tiefer.' : '') + '</p>' +
      (erste ? '<p class="leise">Name vorgeschlagen: „' + esc(g.name) + '“. Ändern über „Umbenennen“.</p>' : '') });
    if (S.seite !== 'luecken') zeichnen();
  }, 1400);
}

function kopieren(knopf) {
  const text = knopf.closest('.baustein').querySelector('.bt').textContent;
  const fertig = () => { knopf.textContent = 'Kopiert'; setTimeout(() => { knopf.textContent = 'Kopieren'; }, 1600); };
  const notfalls = () => {
    const r = document.createRange(); r.selectNodeContents(knopf.closest('.baustein').querySelector('.bt'));
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    knopf.textContent = 'Markiert, jetzt kopieren';
  };
  try { navigator.clipboard.writeText(text).then(fertig, notfalls); } catch (e) { notfalls(); }
}

function anhaengen(dateien) {
  Array.from(dateien).slice(0, 5).forEach((f) => {
    const eintrag = { name: f.name, url: '' };
    S.anhang.push(eintrag);
    if (f.type && f.type.startsWith('image/')) {
      const r = new FileReader();
      r.onload = () => { eintrag.url = r.result; speichernEntwurf(); zeichnen(); };
      r.readAsDataURL(f);
    }
  });
  speichernEntwurf(); zeichnen();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-akt]');
  if (!el) return;
  const a = el.dataset.akt;
  if (a === 'hintergrund') { if (e.target === el) { S.schicht = null; schicht(); } return; }
  if (el.tagName === 'SELECT') return;
  switch (a) {
    case 'ort': {
      speichernEntwurf();
      const z = el.dataset.ziel; S.umbenennen = false; S.band = ''; S.vorher = null;
      if (z === 'heute') { S.ansicht = 'heute'; break; }
      S.ort = z; S.bOffen = false;
      const ids = gespraecheAm(z);
      if (S.seite === 'a') {
        if (z === 'ohne') S.ansicht = 'liste';
        else if (ids.length) { S.ansicht = 'gespraech'; S.gespraech = ids[0]; }
        else S.ansicht = 'uebersicht';
      } else { S.ansicht = z === 'ohne' ? 'liste' : 'uebersicht'; S.reiterB = 'uebersicht'; }
      break;
    }
    case 'oeffnen': oeffnen(el.dataset.id); return;
    case 'liste': speichernEntwurf(); S.ansicht = 'liste'; S.bOffen = false; break;
    case 'uebersicht': speichernEntwurf(); S.ansicht = 'uebersicht'; break;
    case 'zurueckgespraech': { const ids = gespraecheAm(S.ort); if (ids.length) { oeffnen(ids.includes(S.gespraech) ? S.gespraech : ids[0]); return; } S.ansicht = 'liste'; break; }
    case 'reiter': S.reiterB = el.dataset.r; S.bOffen = false; S.ansicht = el.dataset.r === 'gespraeche' ? 'liste' : 'uebersicht'; break;
    case 'neu': {
      speichernEntwurf();
      const id = 'n' + Date.now();
      S.gespraeche[id] = { ort: S.ort, name: 'Neues Gespräch', zuletzt: 'gerade eben', msgs: [] };
      S.entwurf = ''; oeffnen(id); const t = $('#text'); if (t) t.focus(); return;
    }
    case 'umbenennen': speichernEntwurf(); S.umbenennen = true; zeichnen(); { const i = $('#gname'); if (i) { i.focus(); i.select(); } } return;
    case 'namespeichern': { const v = ($('#gname') || {}).value; if (v && v.trim()) S.gespraeche[S.gespraech].name = v.trim(); S.umbenennen = false; break; }
    case 'kopieren': kopieren(el); return;
    case 'reihenfrage': {
      speichernEntwurf();
      const k = S.gespraeche[S.gespraech].ort;
      const text = el.closest('.baustein').querySelector('.bt').textContent;
      S.vorher = { k, alt: S.reihenfrage[k] || '' };
      S.reihenfrage[k] = text;
      S.band = 'Als Reihenfrage von ' + esc(ORTE[k].titel) + ' übernommen.';
      break;
    }
    case 'rueckgaengig': if (S.vorher) { S.reihenfrage[S.vorher.k] = S.vorher.alt; } S.vorher = null; S.band = 'Zurückgenommen: Reihenfrage wie vorher.'; break;
    case 'bandzu': S.band = ''; break;
    case 'rfaendern': S.vorher = null; S.band = 'Hier öffnet sich die Maske „Reihenfrage ändern“, die es in der App schon gibt.'; break;
    case 'beispielfoto': speichernEntwurf(); S.anhang.push({ name: 'Planung.heic (Beispiel)', beispiel: true }); break;
    case 'anhangweg': speichernEntwurf(); S.anhang.splice(Number(el.dataset.i), 1); break;
    case 'bisher': {
      speichernEntwurf();
      const g = S.gespraeche[S.gespraech];
      g.msgs.push({ wer: 'claude', zeit: jetzt(), html: '<h3>Was wir bisher haben</h3><ul>' +
        (g.ort === 'strafe' && S.gespraech === 'g1' ?
          '<li><b>Gewählt:</b> Reihenfrage mit Gefängnis-Bezug' + (S.reihenfrage.strafe ? ' (übernommen)' : ' (noch nicht übernommen)') + '</li><li><b>Verworfen:</b> „Wozu sperren wir Menschen ein?“, zu offen; die Fassung mit „gerecht oder besser“ war für Klasse 8 zu abstrakt</li><li><b>Offen:</b> Fall für Stunde 4</li>'
          : '<li>Hier stünde eine kurze Zusammenfassung: was gewählt, was verworfen, was offen ist.</li>') + '</ul>' });
      zeichnen(); const v = $('#verlauf'); if (v) v.lastElementChild.scrollIntoView({ block: 'nearest' }); return;
    }
    case 'auftrag': speichernEntwurf(); S.schicht = 'auftrag'; schicht(); return;
    case 'ablegen': speichernEntwurf(); S.schicht = 'ablegen'; S.ablegenDatei = ''; schicht(); return;
    case 'verschieben': S.schicht = 'verschieben'; schicht(); return;
    case 'beispieldatei': S.ablegenDatei = 'Bewertungskriterien.pdf'; schicht(); return;
    case 'ablegenok': {
      const k = S.ansicht === 'gespraech' && S.gespraeche[S.gespraech] ? S.gespraeche[S.gespraech].ort : S.ort;
      const gilt = ($('#gilt') || {}).value || 'ganze Reihe';
      (S.dateien[k] = S.dateien[k] || []).push([S.ablegenDatei, gilt + ' · heute']);
      S.schicht = null; S.vorher = null; S.band = 'Abgelegt: ' + esc(S.ablegenDatei) + '. Gespräche an diesem Ort kennen die Datei jetzt.';
      break;
    }
    case 'abschicken': S.schicht = null; S.vorher = null; S.band = 'In der echten App würde der Auftrag jetzt starten und unter „Läuft gerade“ stehen. Die Skizze schickt nichts ab.'; break;
    case 'schliessen': S.schicht = null; schicht(); return;
    case 'altfragen': {
      const t = ($('#altfrage') || {}).value || '';
      if (t.trim()) S.altchat.push([t.trim(), 'Kurze Antwort wie heute in der rechten Spalte (Skizze).']);
      if (S.altchat.length > 3) S.altchat.shift();
      break;
    }
    default: return;
  }
  zeichnen();
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'gwahl') { oeffnen(e.target.value); }
  else if (e.target.id === 'foto') { anhaengen(e.target.files); }
  else if (e.target.id === 'gruendlich') { S.gruendlich = e.target.checked; }
  else if (e.target.id === 'netz') { S.netz = e.target.checked; }
  else if (e.target.id === 'ablegedatei' && e.target.files[0]) { S.ablegenDatei = e.target.files[0].name; schicht(); }
});
document.addEventListener('submit', (e) => { if (e.target.id === 'eingabe') { e.preventDefault(); senden(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.schicht) { S.schicht = null; schicht(); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'text') { e.preventDefault(); senden(); }
});
document.addEventListener('paste', (e) => {
  if (e.target.id !== 'text' || !e.clipboardData) return;
  const bilder = Array.from(e.clipboardData.files || []).filter((f) => f.type.startsWith('image/'));
  if (bilder.length) { e.preventDefault(); anhaengen(bilder.map((f) => new File([f], f.name || 'Bildschirmfoto.png', { type: f.type }))); }
});

$('#zuruecksetzen').addEventListener('click', () => { const seite = S.seite; S = frische(); S.seite = seite; zeichnen(); });

function nachHash() {
  const h = location.hash.replace('#', '');
  speichernEntwurf();
  S.seite = h === 'variante-a' ? 'a' : h === 'variante-b' ? 'b' : 'luecken';
  if (S.seite === 'b' && S.ansicht === 'gespraech' && !S.bOffen) { S.reiterB = 'gespraeche'; S.bOffen = true; }
  S.band = ''; S.vorher = null;
  zeichnen();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', nachHash);
nachHash();
})();
</script>
