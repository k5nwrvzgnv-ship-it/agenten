<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neurolign Aufnahme</title><meta name="color-scheme" content="dark"><link rel="icon" href="data:,"><link rel="stylesheet" href="stil.css"></head><body>
<header><h1><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><path d="M30 71V29L70 71V29"/><g><circle cx="30" cy="29" r="7.6"/><circle cx="70" cy="29" r="7.6"/><circle cx="30" cy="71" r="7.6"/><circle cx="70" cy="71" r="7.6"/></g></svg>Neurolign</h1>
<div class="weg-nav" role="navigation" aria-label="Ansicht"><a href="/" aria-current="page">Aufnahme</a><a href="/labeln">Labeln</a><a href="/training">Training</a></div>
<nav aria-label="Balken"><label class="nurvor" for="wahl">Balken</label><select id="wahl"></select><button id="neu" title="Neuer Balken" aria-label="Neuer Balken"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></nav>
<button id="handy"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2.5h10v19H7zM10.5 18.5h3"/></svg><i></i></button>
<button id="einst" title="Einrichtung" aria-label="Einrichtung">···</button></header>

<main id="form" hidden><form novalidate><h2 id="ftitel">Neuer Balken</h2>
<div class="felder"><label>Länge<span><input name="laenge" inputmode="decimal" autocomplete="off" required>cm</span></label>
<label>Breite<span><input name="breite" inputmode="decimal" autocomplete="off" required>cm</span></label>
<label>Höhe<span><input name="hoehe" inputmode="decimal" autocomplete="off" required>cm</span></label>
<label>Holzart<span><input name="holzart" autocomplete="off" maxlength="60"></span></label></div>
<p class="fehler" role="alert"></p><button class="haupt" type="submit">Balken anlegen</button></form></main>

<main id="aufnahme" hidden>
<section class="buehne" aria-label="Foto"><div id="bild"></div><div id="bildinfo"></div></section>
<aside><div id="seiten" role="group" aria-label="Seite"></div>
<dl id="werte"></dl>
<div id="kam" hidden><output></output><button class="sy" data-ev="-0.333" title="Dunkler" aria-label="Dunkler"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><button class="sy" data-ev="0.333" title="Heller" aria-label="Heller"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button class="sy" title="Auf die Bildmitte einmessen und sperren" aria-label="Auf die Bildmitte einmessen und sperren"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8z"/></svg></button><button data-m="fest" title="Belichtung fest, 12 MP">12</button><button data-m="fein" title="48 MP, Belichtung kann schwanken">48</button></div>
<label id="vorschub" title="Vorschub"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h17M14 6l6 6-6 6"/></svg><span><input aria-label="Vorschub" inputmode="decimal" autocomplete="off">cm</span></label>
<p id="warnung" class="warn" role="status"></p>
<div class="tun"><p id="schritt" aria-live="polite"></p><p class="fehler" id="afehler" role="alert"></p><button class="haupt" id="los"><span></span><kbd>Leertaste</kbd></button></div></aside>
<section class="band" aria-label="Abschnitte"><div id="abschnitte"></div></section></main>

<dialog id="dlg" aria-labelledby="dtitel"><button class="zu" aria-label="Schließen" title="Schließen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><h2 id="dtitel">Einrichtung</h2>
<form id="abstand" novalidate><h3>Kamera</h3><label>Linse bis Rolle, ohne Balken<span><input name="kr" inputmode="decimal" autocomplete="off">cm</span></label><button class="sy" title="Speichern" aria-label="Speichern"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l5 5L20 6"/></svg></button><p class="fehler" role="alert"></p></form>
<h3>Bildwinkel</h3><p id="winkel"></p>
<h3>iPhone-App</h3><div id="appadr"></div>
<h3>Oder iPhone-Kurzbefehl</h3><ol id="kurz"></ol><p class="leise">iPhone und Mac im selben WLAN oder der Mac im Hotspot des iPhones. Automatische Sperre auf „Nie“.</p>
<h3>Foto vom Mac</h3><label class="datei">Für den aktuellen Abschnitt<input type="file" id="datei" accept="image/*,.heic"></label></dialog>
<script src="app.js"></script></body></html>
