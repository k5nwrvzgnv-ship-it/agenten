<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neurolign Hochladen</title><meta name="color-scheme" content="dark"><link rel="icon" href="data:,"><link rel="stylesheet" href="stil.css"></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="schraffur" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V3" stroke="#fff" stroke-width="1.3"/></pattern><pattern id="schraffur-d" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V3" stroke="#000" stroke-width="1.3"/></pattern></defs></svg>
<header><h1><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><path d="M30 71V29L70 71V29"/><g><circle cx="30" cy="29" r="7.6"/><circle cx="70" cy="29" r="7.6"/><circle cx="30" cy="71" r="7.6"/><circle cx="70" cy="71" r="7.6"/></g></svg>Neurolign</h1>
<div class="weg-nav" role="navigation" aria-label="Ansicht"><a href="/" aria-current="page">Hochladen</a><a href="/labeln">Labeln</a><a href="/training">Training</a></div>
<nav aria-label="Balken"><label class="nurvor" for="wahl">Balken</label><select id="wahl"></select><button id="neu" class="sy" title="Neuer Balken" aria-label="Neuer Balken"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></nav>
<span id="ich" class="ich"></span></header>

<main id="form" hidden><form novalidate><h2>Neuer Balken</h2>
<div class="felder"><label>Länge<span><input name="laenge" inputmode="decimal" autocomplete="off" required>cm</span></label>
<label>Breite<span><input name="breite" inputmode="decimal" autocomplete="off" required>cm</span></label>
<label>Höhe<span><input name="hoehe" inputmode="decimal" autocomplete="off" required>cm</span></label>
<label>Holzart<span><input name="holzart" autocomplete="off" maxlength="60"></span></label></div>
<p class="fehler" role="alert"></p>
<div class="formknoepfe"><button type="button" id="abbr" class="sy" title="Abbrechen" aria-label="Abbrechen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button class="haupt" type="submit" title="Balken anlegen" aria-label="Balken anlegen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l5 5L20 6"/></svg></button></div></form></main>

<main id="hoch" hidden>
<section class="galerie" aria-label="Fotos dieser Seite"><ul id="fotos"></ul><div id="leer" class="leer" hidden></div></section>
<aside><div id="seiten" role="group" aria-label="Seite"></div>
<dl id="werte"></dl>
<div class="tun"><progress id="fort" max="1" value="0" hidden aria-label="Hochladen"></progress><p class="fehler" id="hfehler" role="alert"></p>
<label class="haupt dateiknopf" id="waehlen" title="Fotos hochladen" aria-label="Fotos hochladen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 15v5h16v-5"/></svg><input type="file" id="datei" accept="image/jpeg,image/png" multiple class="nurvor"></label></div></aside></main>
<script src="hochladen.js"></script></body></html>
