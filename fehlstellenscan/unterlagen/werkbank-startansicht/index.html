<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Werkbank: Labeln</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Bildarbeitsplatz: neutrales Grau um das Holz, damit Farbe beurteilbar bleibt. Farbe nur für Klassen, Auswahl, Speichern. */
:root{--grund:#c3c7c8;--flaeche:#f6f7f7;--linie:#d3d7d8;--stark:#8a9294;--text:#1b2224;--leise:#566064;--akzent:#00666e;--wahl:#dceff0;--warn:#8a4b00;
--f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:400 14px/1.4 var(--f);color:var(--text);background:var(--flaeche);font-variant-numeric:tabular-nums;display:grid;grid-template:48px minmax(0,1fr) 92px/72px minmax(0,1fr) 320px;grid-template-areas:"kopf kopf kopf" "werk bild seite" "werk film seite"}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;border-radius:4px}
button:disabled{color:var(--stark);cursor:default}
:focus-visible{outline:2px solid var(--akzent);outline-offset:1px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{grid-area:kopf;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--linie)}
h1{font-size:15px;font-weight:600;margin:0 20px 0 0}
.k{height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.k:hover:not(:disabled),.werk button:hover:not(:disabled){background:#e6e9ea}
.pos{min-width:200px;text-align:center}.pos b{font-weight:500}
.frei{flex:1}.nurschmal{display:none}
.rand{border:1px solid var(--stark)}
.werk{grid-area:werk;border-right:1px solid var(--linie);display:flex;flex-direction:column;align-items:stretch;padding:8px 6px;gap:2px}
.werk button{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.werk button[aria-pressed=true]{background:var(--wahl);color:var(--akzent);font-weight:500}
.werk hr{width:100%;border:0;border-top:1px solid var(--linie);margin:6px 0}
.buehne{grid-area:bild;position:relative;background:var(--grund);overflow:hidden;min-height:0}
#bild{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#bild.zeichnen{cursor:crosshair}
#bild .o{cursor:pointer}#bild .pk{cursor:grab}
.hinweis{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--text);color:#fff;padding:8px 14px;border-radius:4px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 24px)}
.hinweis button{color:#9fe6ea;font-weight:500;min-height:24px}
.film{grid-area:film;display:flex;gap:10px;align-items:center;padding:0 12px;border-top:1px solid var(--linie);overflow-x:auto}
.film button{display:flex;gap:8px;align-items:center;text-align:left;padding:6px 12px 6px 6px;min-width:176px;border:1px solid transparent;font-size:13px}
.film button:hover{background:#e6e9ea}.film button[aria-current]{background:var(--wahl);border-color:var(--akzent)}
.film img{width:66px;height:60px;object-fit:cover;display:block;border-radius:2px}
.film span{display:block}.film small{font-size:12px;color:var(--leise)}
.film .ok,.ok{color:#17603a}
.seite{grid-area:seite;border-left:1px solid var(--linie);display:flex;flex-direction:column;min-height:0}
.seite h2{font-size:14px;font-weight:600;margin:0;padding:12px 16px 8px;display:flex;justify-content:space-between}.seite h2 span{font-weight:400;color:var(--leise)}
#liste{flex:1;overflow:auto;list-style:none;margin:0;padding:0;border-top:1px solid var(--linie)}
#liste li{border-bottom:1px solid var(--linie)}
.zl{width:100%;display:grid;grid-template-columns:16px 12px minmax(0,1fr) auto 64px;gap:8px;align-items:center;text-align:left;padding:0 16px;min-height:44px;border-radius:0}
.zl:hover{background:#ebeeee}li.an{background:var(--wahl)}li.an .zl{font-weight:500}
.fb{width:12px;height:12px;border-radius:2px;box-shadow:0 0 0 1px #0005}
.zl .st{font-size:12px;color:var(--leise);font-weight:400;text-align:right}.zl .st.ok{color:#17603a}.zl .st.un{color:var(--warn)}
.dp{margin:0;padding:0 16px 6px;color:var(--warn)}.zl b{font-weight:500}.ed{padding:4px 16px 14px}
.kl{display:grid;grid-template-columns:1fr 1fr;gap:4px;border:0;padding:0;margin:0 0 12px}
.kl label{display:flex;align-items:center;gap:7px;min-height:32px;padding:0 8px;background:var(--flaeche);border:1px solid var(--linie);border-radius:4px;cursor:pointer;position:relative}
.kl input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}.kl label:hover{border-color:var(--stark)}.kl label:has(:checked){border-color:var(--akzent);box-shadow:inset 0 0 0 1px var(--akzent);font-weight:500}.kl label:has(:focus-visible){outline:2px solid var(--akzent);outline-offset:1px}
.kl kbd{margin-left:auto}kbd{font:inherit;font-size:12px;color:var(--leise)}
.rg{display:grid;grid-template-columns:68px minmax(0,1fr) 64px;gap:8px;align-items:center;min-height:36px}.rg input{width:100%;accent-color:var(--akzent);height:24px;margin:0}.rg output{text-align:right}
.ed details summary{min-height:32px;display:flex;align-items:center;cursor:pointer;color:var(--leise)}.ed details summary::before{content:"";width:7px;height:7px;border:solid var(--leise);border-width:0 1.5px 1.5px 0;transform:rotate(-45deg);margin-right:8px}.ed details[open] summary::before{transform:rotate(45deg)}
.ed dl{display:grid;grid-template-columns:1fr auto;margin:4px 0 8px;gap:4px}.ed dd{margin:0}
.akt{display:flex;gap:8px;margin-top:8px}.akt .gut{flex:1;height:44px;background:var(--akzent);color:#fff;font-weight:600}.akt .gut:hover{background:#00545b!important}.gut kbd{color:#d5f1f2;font-weight:400}
.akt .lo{width:44px;height:44px;border:1px solid var(--stark);display:grid;place-items:center;background:#fff}.akt .lo:hover{border-color:#a3221d;color:#a3221d}
.leer{padding:16px;color:var(--leise)}
.fuss{padding:12px 16px;border-top:1px solid var(--linie)}
.sp{width:100%;height:44px;background:#fff;border:1px solid var(--akzent);color:var(--akzent);font-weight:600}.sp:hover{background:#eef8f8}.sp.voll{background:var(--akzent);color:#fff}.sp.voll:hover{background:#00545b}
.gutm{display:none}.fuss p{margin:8px 0 0;font-size:12px;color:var(--leise)}
#tasten{border:1px solid var(--stark);border-radius:4px;padding:16px 20px;background:#fff;color:var(--text)}#tasten h2{font-size:14px;margin:0 0 8px}#tasten dl{display:grid;grid-template-columns:auto auto;gap:4px 24px;margin:0}#tasten dd{margin:0;color:var(--leise)}
.ziel{outline:3px solid var(--akzent);outline-offset:-3px}
@media(max-width:860px){
html,body{height:auto}body{grid-template:48px 92vw 56px auto/minmax(0,1fr);grid-template-areas:"kopf" "bild" "werk" "seite";padding-bottom:110px}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.film,.nurbreit{display:none!important}.nurschmal{display:inline}header{padding:0 6px;gap:0;position:sticky;top:0;background:var(--flaeche);z-index:2}.k{height:44px;min-width:44px}.pos{min-width:0;flex:1}.frei{display:none}
.werk{flex-direction:row;border:0;border-bottom:1px solid var(--linie);padding:2px 4px;gap:0}.werk button{flex:1;min-height:50px;font-size:11.5px}.werk hr{display:none}
.seite{border:0}#liste{overflow:visible}.zl{min-height:48px}.kl label{min-height:44px}.kl kbd{display:none}.rg{min-height:44px}.rg input{height:32px}.akt .gut,.akt .lo{height:44px}.akt .lo{width:48px}
.fuss{position:fixed;left:0;right:0;bottom:0;background:var(--flaeche);z-index:3;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.fuss{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fuss p{grid-column:1/-1;grid-row:1;margin:0}.gutm:not([hidden]){display:flex;background:var(--akzent);color:#fff;font-weight:600}.gutm[hidden]+.sp{grid-column:1/-1}.akt .gut{display:none}.akt .lo{width:auto!important;flex:1;display:flex!important;align-items:center;justify-content:center;gap:8px}.akt .lo::after{content:"Löschen"}.kl{grid-template-columns:1fr 1fr 1fr}.kl label{padding:0 6px;font-size:13px;gap:5px}}
</style></head><body>
<header><h1>Werkbank</h1>

<main class="buehne"><svg id="bild" role="img" aria-label="Bild mit Umrissen"></svg><div class="hinweis" id="hin" role="status" hidden></div></main>
<nav class="film" id="film" aria-label="Bilder"></nav>
<aside class="seite" aria-label="Objekte"><h2>Objekte <span id="stand"></span></h2><ul id="liste"></ul><div class="fuss"><button class="k gutm" id="gutm" hidden>Stimmt</button><button class="sp" id="sp">Speichern und weiter</button><p id="spt"></p></div></aside>

<script>
const $=i=>document.getElementById(i),B=DATEN.bilder,IDS=['153200004','153200015','153200022'];
const K={0:['Ast lebend','#00e0ea'],1:['Ast tot','#ff3fa4'],2:['Astloch','#a48dff'],3:['Ast mit Riss','#ff9a3d'],4:['Riss','#5c9dff'],6:['Harz','#6bea7f']},KL=Object.keys(K);
for(const i of IDS)B[i].src=i+'.jpg';
const fix=x=>x.toFixed(1).replace('.',',').replace('-','−'),kl=(x,a,b)=>Math.max(a,Math.min(b,x));
const flae=p=>p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-b[0]*a[1]},0);
function ber(p,n){const L=[0];p.forEach((a,i)=>{const b=p[(i+1)%p.length];L.push(L[i]+Math.hypot(b[0]-a[0],b[1]-a[1]))});const o=[];let j=0;for(let k=0;k<n;k++){const t=L[p.length]*k/n;while(L[j+1]<t)j++;const a=p[j],b=p[(j+1)%p.length],f=(t-L[j])/((L[j+1]-L[j])||1);o.push([a[0]+f*(b[0]-a[0]),a[1]+f*(b[1]-a[1])])}return o}
const obj=(k,c,p)=>({k,c,b:ber(flae(p)<0?[...p].reverse():p,28),r:0,g:0,ok:false});
const st={};let halt={};try{halt=JSON.parse(localStorage.getItem('werkbank-start')||'{}')}catch(e){}
function lade(i){const h=halt[i];st[i]=h?{o:h.o,zeit:h.zeit,dreck:false,h:[]}:{o:B[i].modell.map(o=>obj(o.k,o.c,o.p)),zeit:null,dreck:false,h:[]}}
IDS.forEach(lade);
let id=IDS[0],sel=-1,zeich=null,maus=null,zieh=null,pan=null,nur=false,V=null,uhr;
const name=i=>B[i].name||i;const S=()=>st[id],akt=()=>S().o[sel],ein=()=>B[id].px?'px':'mm',fak=()=>B[id].px||1;
function form(o){let p=o.b;for(let t=0;t<o.g;t++)p=p.map((a,j)=>{const n=p.length,v=p[(j+n-1)%n],w=p[(j+1)%n];return[a[0]*.5+(v[0]+w[0])*.25,a[1]*.5+(v[1]+w[1])*.25]});
 return p.map((a,j)=>{const n=p.length,v=p[(j+n-1)%n],w=p[(j+1)%n],x=w[0]-v[0],y=w[1]-v[1],l=Math.hypot(x,y)||1;return[kl(a[0]+o.r*y/l,0,B[id].lmm),kl(a[1]-o.r*x/l,0,B[id].qmm)]})}
const pfad=p=>{const n=p.length;return p.reduce((d,a,i)=>{const z=p[(i+n-1)%n],b=p[(i+1)%n],c=p[(i+2)%n];return d+`C${a[0]+(b[0]-z[0])/6} ${a[1]+(b[1]-z[1])/6} ${b[0]-(c[0]-a[0])/6} ${b[1]-(c[1]-a[1])/6} ${b[0]} ${b[1]}`},`M${p[0]}`)+'Z'};
function mass(p){let m={w:1e9},x=0;for(let g=0;g<180;g+=2){const u=[Math.cos(g*Math.PI/180),Math.sin(g*Math.PI/180)],q=p.map(a=>a[0]*u[0]+a[1]*u[1]),lo=Math.min(...q),hi=Math.max(...q);if(hi-lo<m.w)m={w:hi-lo,u,lo,hi};x=Math.max(x,hi-lo)}m.x=x;m.v=[-m.u[1],m.u[0]];const q=p.map(a=>a[0]*m.v[0]+a[1]*m.v[1]);m.m=(Math.min(...q)+Math.max(...q))/2;return m}
const angs=p=>p.some(a=>a[0]<.8||a[1]<.8||a[0]>B[id].lmm-.8||a[1]>B[id].qmm-.8);
const gr=p=>angs(p)?'am Rand':(mass(p).w*fak()).toFixed(ein()=='px'?0:1).replace('.',',')+' '+ein();
const folge=()=>S().o.map((o,i)=>i).sort((a,b)=>(S().o[a].c??2)-(S().o[b].c??2));
const bu_=i=>String.fromCharCode(65+folge().indexOf(i)),mitte=p=>[p.reduce((s,a)=>s+a[0],0)/p.length,p.reduce((s,a)=>s+a[1],0)/p.length];
const doppelt=i=>{const p=form(S().o[i]),m=mitte(p),w=mass(p).w;return S().o.findIndex((o,j)=>{if(j==i)return false;const q=form(o),n=mitte(q);return Math.hypot(m[0]-n[0],m[1]-n[1])<Math.min(w,mass(q).w)*.4})};
function merk(){const s=S();s.h.push(JSON.stringify([s.o,sel]));if(s.h.length>80)s.h.shift();s.dreck=true}
function sag(t,k,f){const h=$('hin');h.hidden=false;h.textContent=t;if(k){const b=document.createElement('button');b.textContent=k;b.onclick=()=>{h.hidden=true;f()};h.append(b)}clearTimeout(uhr);uhr=setTimeout(()=>h.hidden=true,5000)}
/* Bild */
function ganz(){V=[0,0,B[id].lmm,B[id].qmm]}
function zoom(f,x,y){x??=V[0]+V[2]/2;y??=V[1]+V[3]/2;const w=kl(V[2]*f,12,B[id].lmm),q=w/V[2];V=[kl(x-(x-V[0])*q,0,B[id].lmm-w),kl(y-(y-V[1])*q,0,B[id].qmm-V[3]*q),w,V[3]*q];bildZ()}
function bildZ(){const sv=$('bild');sv.setAttribute('viewBox',V.join(' '));const r=sv.getBoundingClientRect(),z=Math.max(V[2]/r.width,V[3]/r.height)||.1;let s=`<image href="${B[id].src}" width="${B[id].lmm}" height="${B[id].qmm}" preserveAspectRatio="none"/>`;
 if(!nur){S().o.forEach((o,i)=>{const a=i==sel,p=form(o),f=K[o.k][1];s+=`<path class="o" data-o="${i}" d="${pfad(p)}" fill="${f}" fill-opacity="${a?.06:.16}" stroke="#000a" stroke-width="${(a?4.500:3.500)*z}"/><path d="${pfad(p)}" fill="none" stroke="${f}" stroke-width="${(a?2.500:1.800)*z}" pointer-events="none"/>`;
 if(a&&!zeich){if(!angs(p)){const m=mass(p),P=x=>[m.u[0]*x+m.v[0]*m.m,m.u[1]*x+m.v[1]*m.m],A=P(m.lo),E=P(m.hi);s+=`<path d="M${A}L${E}" stroke="#000a" stroke-width="${3.500*z}" pointer-events="none"/><path d="M${A}L${E}" stroke="#fff" stroke-width="${1.500*z}" pointer-events="none"/>`}
 p.forEach((q,j)=>{if(j%2==0)s+=`<rect x="${q[0]-3.500*z}" y="${q[1]-3.500*z}" width="${7*z}" height="${7*z}" fill="#fff" stroke="#000" stroke-width="${z}" pointer-events="none"/><circle class="pk" data-p="${j}" cx="${q[0]}" cy="${q[1]}" r="${10*z}" fill="transparent"/>`});
 const ob=Math.min(...p.map(q=>q[1])),re=Math.max(...p.map(q=>q[0])),li=Math.min(...p.map(q=>q[0])),t=`${bu_(i)} ${K[o.k][0]}, ${gr(p)}`,rx=re+12*z+t.length*8.500*z<V[0]+V[2]?re+12*z:li-12*z,anc=rx>li?'start':'end';s+=`<text x="${rx}" y="${ob+14*z}" text-anchor="${anc}" font-size="${15*z}" font-weight="600" font-family="IBM Plex Sans,sans-serif" fill="#fff" stroke="#000c" stroke-width="${4*z}" paint-order="stroke" stroke-linejoin="round" pointer-events="none">${t}</text>`}});
 if(!zeich){S().o.forEach((o,i)=>{if(i==sel)return;const p=form(o),l=Math.min(...p.map(q=>q[0])),re=Math.max(...p.map(q=>q[0])),u=Math.max(...p.map(q=>q[1])),d=doppelt(i);const x=(l+re)/2,y=d>=0?(u+20*z):(Math.min(...p.map(q=>q[1]))+u)/2+5*z;s+=`<text x="${x}" y="${y}" text-anchor="middle" font-size="${15*z}" font-weight="600" font-family="IBM Plex Sans,sans-serif" fill="#fff" stroke="#000c" stroke-width="${4*z}" paint-order="stroke" pointer-events="none">${bu_(i)}</text>`})}
 if(zeich&&zeich.length){s+=`<polyline points="${[...zeich,maus||zeich.at(-1)].join(' ')}" fill="none" stroke="#000" stroke-width="${4*z}"/><polyline points="${[...zeich,maus||zeich.at(-1)].join(' ')}" fill="none" stroke="#fff" stroke-width="${2*z}"/>`;zeich.forEach((q,i)=>s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${(i?4:7)*z}" fill="#fff" stroke="#000" stroke-width="${z}"/>`)}}
 sv.innerHTML=s;sv.classList.toggle('zeichnen',!!zeich);$('fit').disabled=V[2]>=B[id].lmm-.01}
/* Liste */
function zeile(i){const o=S().o[i],p=form(o),a=i==sel,dp=doppelt(i),s=o.ok?['geprüft','ok']:o.c===null?['neu','']:[`KI ${Math.round(o.c*100)} %`,o.c<.7?'un':''];
 return`<li class="${a?'an':''}"><button class="zl" data-i="${i}" aria-expanded="${a}"><b>${bu_(i)}</b><span class="fb" style="background:${K[o.k][1]}"></span><span>${K[o.k][0]}</span><span class="gr">${gr(p)}</span><span class="st ${s[1]}">${s[0]}</span></button>${a?(dp>=0?`<p class="dp">Liegt auf ${bu_(dp)}. Eins von beiden löschen.</p>`:'')+ed(o,p):''}</li>`}
