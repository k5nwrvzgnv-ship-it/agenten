<title>Neurolign Werkbank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* Layout: das Holz füllt den Raum, Werkzeuge liegen am Rand. Formsprache aus dem N: runde Knoten, kräftige Verbindungen. */
:root{color-scheme:dark;--schwarz:#000;--logo:#000;--hell:#fff;--grau:#8d9291;--nuss:#6ff7e8;--rot:#ff4fd8;--holz:#b98432;--f:"Outfit","Century Gothic","Avenir Next",sans-serif}
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--schwarz);color:var(--hell);font:400 15px/1.35 var(--f);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--nuss);outline-offset:3px;border-radius:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px;flex:none}
.logo{display:flex;align-items:center;gap:12px;font-weight:500;font-size:23px;letter-spacing:-.01em}.logo svg{width:38px;height:38px}.logo em{font-style:normal;color:var(--holz)}
nav{display:flex;gap:30px}nav button{position:relative;height:44px;color:var(--grau);font-size:16px;transition:color .15s}nav button:hover{color:var(--hell)}
nav button::after{content:"";position:absolute;left:50%;bottom:0;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--nuss);transform:scale(0);transition:transform .2s}
nav button[aria-current]{color:var(--hell)}nav button[aria-current]::after{transform:scale(1)}
.leute{display:flex;align-items:center}.leute i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--grau);box-shadow:inset 0 0 0 2px #2c3030}.leute i+i{margin-left:14px;position:relative}.leute i+i::before{content:"";position:absolute;right:100%;width:14px;height:2px;background:#2c3030}.leute i.ich{background:var(--hell);color:var(--logo);box-shadow:none}
main{flex:1;min-height:0;padding-bottom:16px}
.platz{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px;height:100%}
.buehne{position:relative;min-height:0;border-radius:26px;overflow:hidden;background:#000}
.buehne>svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none}
.leiste{position:absolute;left:18px;top:18px;display:flex;flex-direction:column;gap:8px}
.leiste button{width:46px;height:46px;border-radius:50%;background:#000e0;display:grid;place-items:center;transition:background .15s}.leiste button:hover{background:#2c3030}.leiste button[aria-pressed=true]{background:var(--hell);color:var(--logo)}
.leiste svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.film{position:absolute;left:18px;bottom:18px;display:flex;align-items:center}
.film button{width:66px;height:66px;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 0 0 3px #000}.film button+button{margin-left:22px;overflow:visible}.film button+button::before{content:"";position:absolute;right:calc(100% + 3px);top:31px;width:16px;height:4px;background:#fff;opacity:.6}
.film img{width:66px;height:66px;object-fit:cover;border-radius:50%;display:block;filter:brightness(.6)}.film [aria-pressed=true]{box-shadow:0 0 0 4px var(--hell)}.film [aria-pressed=true] img{filter:none}
.film b{position:absolute;right:-3px;top:-3px;width:22px;height:22px;border-radius:50%;background:var(--nuss);color:#000;font-size:13px;font-weight:600;display:grid;place-items:center}.film button:first-child{overflow:visible}
.rechts{display:flex;flex-direction:column;gap:26px;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 6px 0}
.zahl{font-weight:200;font-size:64px;line-height:.9;letter-spacing:-.045em}.zahl small{font-size:22px;letter-spacing:0;color:var(--grau);margin-left:8px}
.neben{display:flex;gap:22px;color:var(--grau);margin-top:14px;font-variant-numeric:tabular-nums}.neben b{color:var(--hell);font-weight:500}.neben .rot{color:var(--rot)}
.raeder{display:flex;justify-content:space-between}.rad{width:120px;text-align:center;color:var(--grau);font-size:14px}.rad svg{width:120px;height:120px;display:block;cursor:grab;touch-action:none}.rad svg:active{cursor:grabbing}
.kl button{display:flex;align-items:center;gap:14px;width:100%;height:38px;color:var(--grau);text-align:left;position:relative}.kl button:hover{color:var(--hell)}
.kl i{width:14px;height:14px;border-radius:50%;flex:none;transition:transform .15s;z-index:1}.kl button+button::before{content:"";position:absolute;left:6px;top:-12px;width:2px;height:24px;background:#2c3030}
.kl [aria-pressed=true]{color:var(--hell);font-weight:500}.kl [aria-pressed=true] i{transform:scale(1.5)}
.los{flex:none;margin-top:auto;height:60px;border-radius:30px;background:var(--hell);color:var(--logo);font-weight:500;font-size:17px;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;transition:background .15s}.los:hover{background:var(--nuss)}.los svg{width:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.zeile{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:left;padding:14px 0;border-radius:8px}.zeile span:nth-child(2){font-weight:500;font-variant-numeric:tabular-nums}.zeile .balken{grid-column:1/-1;height:4px;border-radius:2px;background:#232626;position:relative}.balken i{position:absolute;left:0;top:0;height:4px;border-radius:2px;background:var(--hell)}.balken i::after{content:"";position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:inherit}.zeile small{grid-column:1/-1;color:var(--grau);font-size:13.5px}.zeile.streit .balken i{background:var(--rot)}.zeile[aria-pressed=true]{color:var(--nuss)}
.leg{display:flex;gap:22px;color:var(--grau)}.leg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
.train{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px;height:100%;overflow:auto}
.train>div{min-width:0}.train svg.gr{width:100%;display:block}
.werte{display:flex;gap:56px;flex-wrap:wrap;margin:8px 0 24px}.werte span{color:var(--grau);display:block}.werte .zahl{font-size:54px}
.wahl{margin-bottom:28px}.wahl h2{font:400 14px var(--f);color:var(--grau);margin:0 0 10px}.seg{display:flex;background:var(--logo);border-radius:24px;padding:4px}.seg button{flex:1;height:40px;border-radius:20px;color:var(--grau)}.seg [aria-pressed=true]{background:#45413b;color:var(--hell)}
text{font-family:var(--f)}
@media(max-width:860px){html,body{height:auto}header{height:auto;flex-wrap:wrap;padding-block:12px}.leute{display:none}nav{gap:20px}.platz,.train{grid-template-columns:minmax(0,1fr);height:auto}.buehne{height:104vw}.rechts{overflow:visible}.film button,.film img{width:48px;height:48px}.film button+button::before{top:22px}.raeder{justify-content:space-around}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Lichtsaum */
@property --w{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes lauf{to{--w:360deg}}
.leiste button,.los,.seg{position:relative;isolation:isolate}
.leiste button::before,.los::before,.seg::before,.leiste button::after,.los::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:conic-gradient(from var(--w),#ffffff24,#ffffff24 50%,#6ff7e8 72%,#fff 78%,#ffffff24 90%);-webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none;animation:lauf 7s linear infinite}
.seg::before{animation:none;background:#ffffff20}
.leiste button::after,.los::after{inset:-1px;padding:2px;filter:blur(5px);opacity:.35;transition:opacity .25s}.leiste button:hover::after,.los:hover::after,.leiste [aria-pressed=true]::after{opacity:1}
.leiste button{width:38px;height:38px;background:#000c}.leiste button:hover{background:#000}.leiste button[aria-pressed=true]{background:#000;color:var(--nuss)}.leiste svg{width:18px;height:18px;stroke-width:1.5}
.los,.los:hover{height:46px;background:#000;color:var(--hell);font-weight:400;font-size:15px}.los svg{width:18px;stroke-width:1.5}
.seg,.seg [aria-pressed=true]{background:#000}.seg [aria-pressed=true]{color:var(--nuss);text-shadow:0 0 12px #6ff7e899}.seg button{height:34px}
.buehne{border-radius:16px}.leute i{width:28px;height:28px;font-size:12px;box-shadow:inset 0 0 0 1px #3a3f3f}.leute i+i::before{height:1px}.leute i.ich{background:#000;color:#fff;box-shadow:inset 0 0 0 1px #fff}
.logo{font-size:20px;font-weight:400}.logo svg{width:32px;height:32px}
nav button::after{width:4px;height:4px;margin-left:-2px;box-shadow:0 0 8px var(--nuss)}
.film button,.film img{width:48px;height:48px}.film button{box-shadow:0 0 0 1px #ffffff40}.film [aria-pressed=true]{box-shadow:0 0 0 1px var(--nuss),0 0 14px #6ff7e866}.film button+button::before{top:24px;height:1px;width:21px;right:calc(100% + 1px)}.film b{width:16px;height:16px;font-size:10px;font-weight:500;background:#000;color:#fff;box-shadow:0 0 0 1px #ffffff40}
.kl button{height:32px}.kl i,.kl [aria-pressed=true] i{width:7px;height:7px;transform:none;background:#000;box-shadow:0 0 0 1px #8d9291;margin-left:4px}.kl [aria-pressed=true] i{background:var(--nuss);box-shadow:0 0 10px var(--nuss)}.kl [aria-pressed=true]{font-weight:400}.kl button+button::before{left:7px;width:1px;top:-9px;height:18px}
.zeile .balken,.balken i{height:1px}.balken i::after{width:6px;height:6px;right:-3px;top:-2.5px;box-shadow:0 0 8px currentColor}.zeile.streit .balken i::after{box-shadow:0 0 8px var(--rot)}.leg i{width:7px;height:7px}
.zeile span:nth-child(2){font-weight:400}
</style>
<header><div class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#fff"/><g stroke="#21201e" stroke-width="6.4"><path d="M30 71V29L70 71V29" fill="none"/></g><g fill="#21201e"><circle cx="30" cy="29" r="7.6"/><circle cx="70" cy="29" r="7.6"/><circle cx="30" cy="71" r="7.6"/><circle cx="70" cy="71" r="7.6"/></g></svg><span>Neuro<em>lign</em></span></div>
<nav aria-label="Bereiche"><button data-s="labeln">Labeln</button><button data-s="vergleichen">Vergleichen</button><button data-s="training">Trainieren</button></nav>
<div class="leute" aria-label="Team"><i class="ich" title="Jan">J</i><i title="Henri">H</i><i title="Felix">F</i></div></header>
<main id="labeln"><div class="platz"><div class="buehne"><svg id="bild" role="application" aria-label="Bild"></svg>
<div class="leiste"><button id="neu" aria-pressed="false" title="Zeichnen" aria-label="Zeichnen"><svg viewBox="0 0 24 24"><path d="M6 18 8 7l10 3-2 8z"/><g fill="currentColor"><circle cx="8" cy="7" r="1.6"/><circle cx="18" cy="10" r="1.6"/><circle cx="16" cy="18" r="1.6"/><circle cx="6" cy="18" r="1.6"/></g></svg></button><button id="nah" aria-pressed="false" title="Heranholen" aria-label="Heranholen"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5M11 8.5v5M8.5 11h5"/></svg></button><button id="aus" aria-pressed="false" title="Masken aus" aria-label="Masken aus"><svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.500 12 5.500 21.500 12 21.500 12 18 18.500 12 18.500 2.500 12 2.500 12z"/><circle cx="12" cy="12" r="2.600"/></svg></button><button id="rueck" title="Rückgängig" aria-label="Rückgängig"><svg viewBox="0 0 24 24"><path d="M9 6 4 11l5 5M4 11h10a5 5 0 0 1 0 10h-3"/></svg></button><button id="weg" title="Löschen" aria-label="Löschen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="film" id="film"></div></div>
<aside class="rechts"><div id="wert"></div><div class="raeder"><div class="rad"><svg id="rrand" viewBox="0 0 120 120" tabindex="0" role="slider" aria-label="Rand"></svg>Rand</div><div class="rad"><svg id="rglatt" viewBox="0 0 120 120" tabindex="0" role="slider" aria-label="Glätte"></svg>Glätte</div></div><div class="kl" id="kl"></div><button class="los" id="fertig">Passt <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></aside></div></main>
<main id="vergleichen" hidden><div class="platz"><div class="buehne"><svg id="vb" role="img" aria-label="Vergleich"></svg><div class="film" id="vfilm"></div></div><aside class="rechts"><div class="leg"><span><i style="background:#fff"></i>Kodytek</span><span><i style="background:#6ff7e8"></i>KI + Jan</span></div><div id="vl"></div></aside></div></main>
<main id="training" hidden><div class="train"><div id="tl"></div><div id="tr"></div></div></main>
<script src="daten.js"></script>
<script>
const $=i=>document.getElementById(i),B=DATEN.bilder,IDS=Object.keys(B),N='#6ff7e8',K={0:['Ast lebend',N],1:['Ast tot',N],2:['Astloch',N],3:['Ast mit Riss',N],4:['Riss',N],6:['Harz',N]};
const fix=x=>x.toFixed(1).replace('.',',').replace('-','−');
const ber=(p,n)=>{let L=[0];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];L.push(L[i]+Math.hypot(b[0]-a[0],b[1]-a[1]))}const o=[];let j=0;for(let k=0;k<n;k++){const t=L[p.length]*k/n;while(L[j+1]<t)j++;const a=p[j],b=p[(j+1)%p.length],f=(t-L[j])/((L[j+1]-L[j])||1);o.push([a[0]+f*(b[0]-a[0]),a[1]+f*(b[1]-a[1])])}return o};
const fl=p=>p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-b[0]*a[1]},0)/2;
const neuO=(k,c,p)=>({k,c,b:ber(fl(p)<0?[...p].reverse():p,28),r:0,g:0});
const st={};for(const i of IDS)st[i]={o:B[i].modell.map(o=>neuO(o.k,o.c,o.p)),f:false,h:[]};
let id='153200004',sel=0,zeichne=null,maus=null,zieh=null,nur=false,nah=false,vid=id,vsel=-1,vz=null;
function form(o,i=id){let p=o.b.map(a=>[...a]);for(let t=0;t<o.g;t++)p=p.map((a,j)=>{const v=p[(j+p.length-1)%p.length],n=p[(j+1)%p.length];return[a[0]*.5+(v[0]+n[0])*.25,a[1]*.5+(v[1]+n[1])*.25]});
 return p.map((a,j)=>{const v=p[(j+p.length-1)%p.length],n=p[(j+1)%p.length],x=n[0]-v[0],y=n[1]-v[1],l=Math.hypot(x,y)||1;return[Math.min(B[i].lmm,Math.max(0,a[0]+o.r*y/l)),Math.min(B[i].qmm,Math.max(0,a[1]-o.r*x/l))]})}
const pfad=p=>{let d=`M${p[0]}`;p.forEach((a,i)=>{const n=p.length,z=p[(i+n-1)%n],b=p[(i+1)%n],c=p[(i+2)%n];d+=`C${a[0]+(b[0]-z[0])/6} ${a[1]+(b[1]-z[1])/6} ${b[0]-(c[0]-a[0])/6} ${b[1]-(c[1]-a[1])/6} ${b[0]} ${b[1]}`});return d+'Z'};
function mass(p){let m={w:1e9},x=0;for(let g=0;g<180;g+=2){const u=[Math.cos(g*Math.PI/180),Math.sin(g*Math.PI/180)],q=p.map(a=>a[0]*u[0]+a[1]*u[1]),lo=Math.min(...q),hi=Math.max(...q);if(hi-lo<m.w)m={w:hi-lo,u,lo,hi};x=Math.max(x,hi-lo)}m.x=x;const v=[-m.u[1],m.u[0]],q=p.map(a=>a[0]*v[0]+a[1]*v[1]);m.v=v;m.vl=Math.min(...q);m.vh=Math.max(...q);return m}
const akt=()=>st[id].o[sel],merk=()=>{st[id].h.push(JSON.stringify(st[id].o));if(st[id].h.length>80)st[id].h.shift()};
const rand=(p,i)=>p.some(a=>a[0]<.8||a[1]<.8||a[0]>B[i].lmm-.8||a[1]>B[i].qmm-.8);
function blick(p,i){const b=B[i];if(!p)return[0,0,b.lmm,b.qmm];const xs=p.map(a=>a[0]),ys=p.map(a=>a[1]),w=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))*2.6;return[(Math.max(...xs)+Math.min(...xs)-w)/2,(Math.max(...ys)+Math.min(...ys)-w)/2,w,w]}
const bildtag=i=>`<image href="${i}.jpg" width="${B[i].lmm}" height="${B[i].qmm}" preserveAspectRatio="none"/>`;
function malBild(){const sv=$('bild');if(!zieh){const v=blick(nah&&akt()?form(akt()):null,id);sv.setAttribute('viewBox',v.join(' '));sv.setAttribute('preserveAspectRatio','xMidYMid meet');sv.z=v[2]/B[id].lmm}const z=Math.max(.28,sv.z||1);let s=bildtag(id);
 if(!nur){st[id].o.forEach((o,i)=>{const p=form(o),f=K[o.k][1],a=i==sel;s+=`<path data-o="${i}" d="${pfad(p)}" fill="${f}" fill-opacity="${a?.05:.1}" stroke="${f}" stroke-opacity="${a?1:.75}" stroke-width="${(a?.55:.4)*z}" style="cursor:pointer;filter:drop-shadow(0 0 ${(a?1.6:.7)*z}px ${f})"/>`;
 if(a&&!zeichne){const m=mass(p),P=(x,y)=>[m.u[0]*x+m.v[0]*y,m.u[1]*x+m.v[1]*y],e=m.vh+5*z,A=P(m.lo,e),E=P(m.hi,e);s+=`<g stroke="#fff" stroke-width="${.9*z}" pointer-events="none"><path d="M${A}L${E}" stroke-width="${.45*z}"/><circle cx="${A[0]}" cy="${A[1]}" r="${.8*z}" fill="#fff"/><circle cx="${E[0]}" cy="${E[1]}" r="${.8*z}" fill="#fff"/></g>`;p.forEach((q,j)=>{if(j%2==0)s+=`<circle data-p="${j}" cx="${q[0]}" cy="${q[1]}" r="${.85*z}" fill="#fff" /><circle data-p="${j}" cx="${q[0]}" cy="${q[1]}" r="${1.9*z}" fill="#fff" fill-opacity="0" style="cursor:grab"/>`})}});
 if(zeichne&&zeichne.length){s+=`<polyline points="${[...zeichne,maus||zeichne.at(-1)].join(' ')}" fill="none" stroke="#fff" stroke-width="${.5*z}"/>`;zeichne.forEach(q=>s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${.9*z}" fill="#fff"/>`)}}
 sv.innerHTML=s}
function rad(el,v,lo,hi,txt){const w=x=>(-225+270*(x-lo)/(hi-lo))*Math.PI/180,pt=(x,r)=>[60+Math.cos(w(x))*r,60+Math.sin(w(x))*r],bo=(a,b,c,s)=>{const A=pt(a,46),E=pt(b,46);return`<path d="M${A}A46 46 0 ${270*(b-a)/(hi-lo)>180?1:0} 1 ${E}" fill="none" stroke="${c}" stroke-width="${s}" stroke-linecap="round"/>`},n=Math.max(lo,Math.min(0,hi)),k=pt(v,46);el.innerHTML=bo(lo,hi,'#232626',2)+(v!=n?bo(Math.min(v,n),Math.max(v,n),'#6ff7e8',2):'')+`<circle cx="${k[0]}" cy="${k[1]}" r="5" fill="#fff" style="filter:drop-shadow(0 0 5px #6ff7e8)"/><text x="60" y="67" text-anchor="middle" font-weight="300" font-size="21" fill="#fff">${txt}</text>`;el.setAttribute('aria-valuenow',v);el.setAttribute('aria-valuetext',txt)}
function malSeite(){const o=akt();for(const i of['weg','nah'])$(i).style.opacity=o?1:.35;rad($('rrand'),o?o.r:0,-4,4,o?(o.r>0?'+':'')+fix(o.r):'–');rad($('rglatt'),o?o.g:0,0,8,o?''+o.g:'–');
 if(!o){$('wert').innerHTML='<div class="zahl">–<small>mm</small></div><div class="neben">&nbsp;</div>'}else{const p=form(o),m=mass(p);$('wert').innerHTML=`<div class="zahl">${fix(m.w)}<small>mm</small></div><div class="neben"><span>max <b>${fix(m.x)}</b></span>${o.c?`<span>KI <b>${Math.round(o.c*100)} %</b></span>`:''}${rand(p,id)?'<span class="rot">angeschnitten</span>':''}</div>`}
 $('kl').innerHTML=Object.entries(K).map(([k,v])=>`<button data-k="${k}" aria-pressed="${!!o&&k==o.k}"><i></i>${v[0]}</button>`).join('')}
const film=(el,a)=>el.innerHTML=IDS.map(i=>`<button data-i="${i}" aria-pressed="${i==a}" aria-label="Bild ${i}"><img src="${i}.jpg" alt=""><b>${st[i].f?'✓':st[i].o.length}</b></button>`).join('');
const mal=()=>{malBild();malSeite();film($('film'),id)};
const ort=e=>{const q=new DOMPoint(e.clientX,e.clientY).matrixTransform($('bild').getScreenCTM().inverse());return[q.x,q.y]};
function schliess(){if(zeichne.length>2){merk();st[id].o.push(neuO(1,null,zeichne));sel=st[id].o.length-1}zeichne=null;maus=null;$('neu').setAttribute('aria-pressed',false);mal()}
