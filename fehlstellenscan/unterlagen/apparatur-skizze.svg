<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold">LED-Fotobox 40 cm als Reiter auf dem Balken (Entwurf, Maße in mm, ca. 1:13)</text>

  <!-- ===== Querschnitt (0,75 px/mm) ===== -->
  <text x="20" y="50" font-weight="bold">Querschnitt (Blick längs des Balkens)</text>
  <!-- Balken 200 x 240 -->
  <rect x="175" y="247" width="150" height="180" fill="#d8b98a" stroke="#000"/>
  <text x="222" y="350">Balken</text>
  <text x="208" y="366" font-size="11">z. B. 200 x 240</text>
  <!-- Bock -->
  <rect x="110" y="427" width="280" height="14" fill="#bbbbbb" stroke="#000"/>
  <line x1="130" y1="441" x2="112" y2="510" stroke="#000" stroke-width="3"/>
  <line x1="370" y1="441" x2="388" y2="510" stroke="#000" stroke-width="3"/>
  <text x="398" y="440">Bock</text>
  <!-- Box: Wand mit Schlitz -->
  <path d="M100,60 L400,60 L400,360 L381,360 L381,247 L119,247 L119,360 L100,360 Z" fill="#f4f4f4" fill-opacity="0.5" stroke="#000"/>
  <!-- schwarz innen unten an den Seitenwänden -->
  <rect x="100" y="247" width="7" height="113" fill="#000"/>
  <rect x="393" y="247" width="7" height="113" fill="#000"/>
  <text x="14" y="300" font-size="11">schwarz innen,</text>
  <text x="14" y="313" font-size="11">unten 150</text>
  <!-- LED -->
  <rect x="106" y="64" width="288" height="6" fill="#f2c200" stroke="#000"/>
  <text x="140" y="84" font-size="11">LEDs der Box (oben innen)</text>
  <!-- Handy -->
  <rect x="225" y="52" width="50" height="8" fill="#444"/>
  <text x="285" y="50" font-size="11">Handy auf dem Loch</text>
  <!-- Sichtfeld: quer 270 mm -->
  <line x1="250" y1="60" x2="149" y2="247" stroke="#1f6fd1" stroke-dasharray="4,3"/>
  <line x1="250" y1="60" x2="351" y2="247" stroke="#1f6fd1" stroke-dasharray="4,3"/>
  <text x="196" y="240" font-size="11" fill="#1f6fd1">Bild quer ca. 270</text>
  <!-- Maße -->
  <line x1="430" y1="60" x2="430" y2="247" stroke="#000"/>
  <line x1="424" y1="60" x2="436" y2="60" stroke="#000"/><line x1="424" y1="247" x2="436" y2="247" stroke="#000"/>
  <text x="440" y="155">h = 250</text>
  <line x1="430" y1="247" x2="430" y2="360" stroke="#000"/>
  <line x1="424" y1="360" x2="436" y2="360" stroke="#000"/>
  <text x="440" y="308">Schlitz 150</text>
  <line x1="119" y1="380" x2="381" y2="380" stroke="#000" stroke-dasharray="2,2"/>
  <text x="335" y="394" font-size="11">Schlitzbreite ca. 350</text>

  <!-- ===== Seitenansicht ===== -->
  <text x="540" y="50" font-weight="bold">Seitenansicht</text>
  <rect x="520" y="247" width="470" height="180" fill="#d8b98a" stroke="#000"/>
  <rect x="520" y="427" width="90" height="14" fill="#bbbbbb" stroke="#000"/>
  <!-- Box -->
  <rect x="600" y="60" width="300" height="300" fill="none" stroke="#000"/>
  <line x1="600" y1="247" x2="600" y2="360" stroke="#d8b98a" stroke-width="3"/>
  <line x1="900" y1="247" x2="900" y2="360" stroke="#d8b98a" stroke-width="3"/>
  <line x1="600" y1="247" x2="600" y2="360" stroke="#000" stroke-dasharray="3,3"/>
  <line x1="900" y1="247" x2="900" y2="360" stroke="#000" stroke-dasharray="3,3"/>
  <text x="606" y="350" font-size="11">Schlitz</text>
  <text x="852" y="350" font-size="11">Schlitz</text>
  <rect x="606" y="64" width="288" height="6" fill="#f2c200" stroke="#000"/>
  <rect x="712" y="52" width="76" height="8" fill="#444"/>
  <!-- Sichtfeld: längs 360 mm -->
  <line x1="750" y1="60" x2="615" y2="247" stroke="#1f6fd1" stroke-dasharray="4,3"/>
  <line x1="750" y1="60" x2="885" y2="247" stroke="#1f6fd1" stroke-dasharray="4,3"/>
  <line x1="615" y1="240" x2="885" y2="240" stroke="#1f6fd1"/>
  <text x="696" y="234" font-size="11" fill="#1f6fd1">Bild längs ca. 360</text>
  <text x="790" y="50" font-size="11">Box 400 x 400 x 400</text>
  <text x="600" y="470" font-size="11">je Bild anheben, ca. 250 weitersetzen, auslösen</text>

  <!-- ===== Legende ===== -->
  <g font-size="12">
    <text x="20" y="548">Fertige LED-Fotobox, in zwei gegenüberliegende Wände je ein Schlitz von unten. Die Schlitzoberkanten liegen auf der</text>
    <text x="20" y="566">Balkenfläche: Abstand fest (h = 250), Licht nur von den Box-LEDs, Kanten vor Schwarz. Wände hängen 150 unter die Fläche.</text>
    <text x="20" y="584">Bildfeld für Hauptkamera 1x (24 mm KB), 48 MP: ca. 36 x 27 cm, rund 22 Px/mm. Flächen bis ca. 23 cm Breite.</text>
  </g>
</svg>
