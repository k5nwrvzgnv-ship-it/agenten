<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold">LED-Fotobox 60 cm als Reiter auf dem Balken (Entwurf, Maße in mm, ca. 1:20)</text>

  <!-- ===== Querschnitt ===== -->
  <text x="20" y="50" font-weight="bold">Querschnitt (Blick längs des Balkens)</text>
  <!-- Bock -->
  <rect x="110" y="405" width="280" height="16" fill="#bbbbbb" stroke="#000"/>
  <line x1="130" y1="421" x2="110" y2="500" stroke="#000" stroke-width="3"/>
  <line x1="370" y1="421" x2="390" y2="500" stroke="#000" stroke-width="3"/>
  <text x="400" y="420">Bock</text>
  <!-- Klotz -->
  <rect x="215" y="355" width="70" height="50" fill="#a07c4a" stroke="#000"/>
  <text x="292" y="390" font-size="11">Klotz, schmaler als Balken</text>
  <!-- Balken -->
  <rect x="200" y="235" width="100" height="120" fill="#d8b98a" stroke="#000"/>
  <text x="222" y="300">Balken</text>
  <!-- Box: Rückwand mit Schlitz -->
  <path d="M100,60 L400,60 L400,360 L362,360 L362,235 L138,235 L138,360 L100,360 Z" fill="#f4f4f4" fill-opacity="0.5" stroke="#000"/>
  <!-- schwarze Auskleidung unten an den Seitenwänden -->
  <rect x="100" y="235" width="7" height="125" fill="#000"/>
  <rect x="393" y="235" width="7" height="125" fill="#000"/>
  <text x="20" y="300" font-size="11">schwarzes Tuch</text>
  <text x="20" y="313" font-size="11">innen, unten</text>
  <!-- LED -->
  <rect x="106" y="64" width="288" height="6" fill="#f2c200" stroke="#000"/>
  <text x="140" y="84" font-size="11">LED-Leisten der Box (oben innen)</text>
  <!-- Handy -->
  <rect x="225" y="52" width="50" height="8" fill="#444"/>
  <text x="285" y="50" font-size="11">Handy auf dem Loch</text>
  <!-- Sichtfeld -->
  <line x1="250" y1="60" x2="155" y2="235" stroke="#1f6fd1" stroke-dasharray="4,3"/>
  <line x1="250" y1="60" x2="345" y2="235" stroke="#1f6fd1" stroke-dasharray="4,3"/>
  <text x="150" y="228" font-size="11" fill="#1f6fd1">Bild quer ca. 380</text>
  <!-- Maße -->
  <line x1="430" y1="60" x2="430" y2="235" stroke="#000"/>
  <line x1="424" y1="60" x2="436" y2="60" stroke="#000"/><line x1="424" y1="235" x2="436" y2="235" stroke="#000"/>
  <text x="440" y="150">h = 350</text>
  <line x1="430" y1="235" x2="430" y2="360" stroke="#000"/>
  <line x1="424" y1="360" x2="436" y2="360" stroke="#000"/>
  <text x="440" y="300">Schlitz 250</text>
  <line x1="138" y1="372" x2="362" y2="372" stroke="#000" stroke-dasharray="2,2"/>
  <text x="150" y="386" font-size="11">Schlitzbreite ca. 450</text>

  <!-- ===== Seitenansicht ===== -->
  <text x="540" y="50" font-weight="bold">Seitenansicht</text>
  <rect x="520" y="235" width="470" height="120" fill="#d8b98a" stroke="#000"/>
  <rect x="540" y="355" width="50" height="50" fill="#a07c4a" stroke="#000"/>
  <rect x="520" y="405" width="90" height="16" fill="#bbbbbb" stroke="#000"/>
  <!-- Box -->
  <rect x="600" y="60" width="300" height="300" fill="none" stroke="#000"/>
  <line x1="600" y1="235" x2="600" y2="360" stroke="#ffffff" stroke-width="3"/>
  <line x1="900" y1="235" x2="900" y2="360" stroke="#ffffff" stroke-width="3"/>
  <line x1="600" y1="235" x2="600" y2="360" stroke="#000" stroke-dasharray="3,3"/>
  <line x1="900" y1="235" x2="900" y2="360" stroke="#000" stroke-dasharray="3,3"/>
  <text x="606" y="350" font-size="11">Schlitz</text>
  <text x="852" y="350" font-size="11">Schlitz</text>
  <rect x="606" y="64" width="288" height="6" fill="#f2c200" stroke="#000"/>
  <rect x="712" y="52" width="76" height="8" fill="#444"/>
  <line x1="750" y1="60" x2="625" y2="235" stroke="#1f6fd1" stroke-dasharray="4,3"/>
  <line x1="750" y1="60" x2="875" y2="235" stroke="#1f6fd1" stroke-dasharray="4,3"/>
  <line x1="625" y1="228" x2="875" y2="228" stroke="#1f6fd1"/>
  <text x="690" y="222" font-size="11" fill="#1f6fd1">Bild längs ca. 500</text>
  <text x="800" y="50" font-size="11">Box 600 x 600 x 600</text>
  <text x="600" y="440" font-size="11">je Bild anheben, ca. 300 weitersetzen, auslösen</text>

  <!-- ===== Legende ===== -->
  <g font-size="12">
    <text x="20" y="530">Fertige faltbare LED-Fotobox, in zwei gegenüberliegende Wände je ein Schlitz von unten. Die Schlitzoberkanten liegen auf der</text>
    <text x="20" y="548">Balkenfläche: Abstand fest (h = 350), Licht nur von den Box-LEDs, Kanten vor schwarzem Tuch. Wände hängen 250 unter die Fläche,</text>
    <text x="20" y="566">daher Balken auf Klötzen, die schmaler sind als der Balken. Bildfeld für Hauptkamera 1x (24 mm KB), 48 MP: ca. 16 Px/mm.</text>
  </g>
</svg>
