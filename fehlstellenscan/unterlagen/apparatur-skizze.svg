<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold">Aufsetzrahmen mit Lichthaube (Entwurf, Maße in mm, Maßstab ca. 1:10)</text>

  <!-- ========== Querschnitt ========== -->
  <text x="20" y="55" font-weight="bold">Querschnitt (Blick längs des Balkens)</text>
  <!-- Haube -->
  <path d="M90,370 L90,70 L410,70 L410,370" fill="none" stroke="#333" stroke-dasharray="6,4"/>
  <text x="300" y="64">schwarzer Molton (Haube)</text>
  <!-- Balken -->
  <rect x="200" y="330" width="100" height="130" fill="#d8b98a" stroke="#000"/>
  <text x="212" y="400">Balken</text>
  <text x="207" y="416">z. B. 200</text>
  <!-- Joch: Querlatte auf der Fläche -->
  <rect x="100" y="306" width="300" height="24" fill="#c9a26b" stroke="#000"/>
  <text x="104" y="300" font-size="11">Querlatte 600, Filz unten</text>
  <!-- Anschläge -->
  <rect x="188" y="330" width="12" height="28" fill="#c9a26b" stroke="#000"/>
  <rect x="300" y="330" width="12" height="28" fill="#c9a26b" stroke="#000"/>
  <text x="318" y="352" font-size="11">Anschlag, Langloch</text>
  <!-- Pfosten und Oberlatte -->
  <rect x="100" y="104" width="24" height="202" fill="#c9a26b" stroke="#000"/>
  <rect x="376" y="104" width="24" height="202" fill="#c9a26b" stroke="#000"/>
  <rect x="100" y="80" width="300" height="24" fill="#c9a26b" stroke="#000"/>
  <!-- Kamerastab und Handy -->
  <rect x="244" y="104" width="12" height="70" fill="#c9a26b" stroke="#000"/>
  <rect x="225" y="174" width="50" height="7" fill="#444"/>
  <text x="262" y="140" font-size="11">Kamerastab, Löcher</text>
  <text x="262" y="153" font-size="11">für h = 300 / 400</text>
  <!-- Sichtfeld -->
  <line x1="250" y1="181" x2="170" y2="330" stroke="#1f6fd1" stroke-dasharray="4,3"/>
  <line x1="250" y1="181" x2="330" y2="330" stroke="#1f6fd1" stroke-dasharray="4,3"/>
  <text x="96" y="385" font-size="11" fill="#1f6fd1">Bild quer ca. 320</text>
  <!-- Maß h -->
  <line x1="430" y1="181" x2="430" y2="330" stroke="#000"/>
  <line x1="424" y1="181" x2="436" y2="181" stroke="#000"/>
  <line x1="424" y1="330" x2="436" y2="330" stroke="#000"/>
  <text x="440" y="260">h = 300</text>
  <!-- Leuchten -->
  <rect x="128" y="196" width="26" height="14" fill="#f2c200" stroke="#000" transform="rotate(45 141 203)"/>
  <rect x="346" y="196" width="26" height="14" fill="#f2c200" stroke="#000" transform="rotate(-45 359 203)"/>
  <line x1="150" y1="214" x2="235" y2="322" stroke="#c99a00" stroke-dasharray="2,3"/>
  <line x1="350" y1="214" x2="265" y2="322" stroke="#c99a00" stroke-dasharray="2,3"/>
  <text x="128" y="172" font-size="11">LED ca. 45°</text>
  <text x="312" y="186" font-size="11">LED ca. 45°</text>
  <text x="128" y="186" font-size="11">(tief: Streiflicht)</text>

  <!-- ========== Seitenansicht ========== -->
  <text x="520" y="55" font-weight="bold">Seitenansicht</text>
  <!-- Haube -->
  <path d="M570,370 L570,70 L934,70 L934,370" fill="none" stroke="#333" stroke-dasharray="6,4"/>
  <!-- Balken -->
  <rect x="510" y="330" width="480" height="130" fill="#d8b98a" stroke="#000"/>
  <!-- Querlatten (Schnitt) -->
  <rect x="580" y="306" width="24" height="24" fill="#c9a26b" stroke="#000"/>
  <rect x="900" y="306" width="24" height="24" fill="#c9a26b" stroke="#000"/>
  <!-- Pfosten -->
  <rect x="580" y="104" width="24" height="202" fill="#c9a26b" stroke="#000"/>
  <rect x="900" y="104" width="24" height="202" fill="#c9a26b" stroke="#000"/>
  <!-- Längslatte oben -->
  <rect x="580" y="80" width="344" height="24" fill="#c9a26b" stroke="#000"/>
  <text x="640" y="97" font-size="11">Längslatte 700 (je Seite eine)</text>
  <!-- Kamerastab und Handy -->
  <rect x="746" y="104" width="12" height="70" fill="#c9a26b" stroke="#000"/>
  <rect x="715" y="174" width="74" height="7" fill="#444"/>
  <text x="796" y="180" font-size="11">Handy, Querformat</text>
  <!-- Sichtfeld -->
  <line x1="752" y1="181" x2="645" y2="330" stroke="#1f6fd1" stroke-dasharray="4,3"/>
  <line x1="752" y1="181" x2="859" y2="330" stroke="#1f6fd1" stroke-dasharray="4,3"/>
  <line x1="645" y1="322" x2="859" y2="322" stroke="#1f6fd1"/>
  <text x="682" y="317" font-size="11" fill="#1f6fd1">Bild längs ca. 430</text>
  <!-- Leuchte dahinter -->
  <rect x="739" y="198" width="26" height="14" fill="none" stroke="#c99a00" stroke-dasharray="3,2"/>
  <text x="792" y="214" font-size="11">Leuchte (dahinter)</text>
  <!-- Abstand Joche -->
  <line x1="604" y1="285" x2="900" y2="285" stroke="#000"/>
  <text x="680" y="280" font-size="11">frei ca. 590 (Querlatten nicht im Bild)</text>
  <!-- Maßband und Zeiger -->
  <line x1="510" y1="420" x2="990" y2="420" stroke="#b00000" stroke-width="2"/>
  <g stroke="#b00000">
    <line x1="530" y1="414" x2="530" y2="426"/><line x1="590" y1="414" x2="590" y2="426"/>
    <line x1="650" y1="414" x2="650" y2="426"/><line x1="710" y1="414" x2="710" y2="426"/>
    <line x1="770" y1="414" x2="770" y2="426"/><line x1="830" y1="414" x2="830" y2="426"/>
    <line x1="890" y1="414" x2="890" y2="426"/><line x1="950" y1="414" x2="950" y2="426"/>
  </g>
  <line x1="592" y1="330" x2="592" y2="410" stroke="#000" stroke-width="2"/>
  <polygon points="586,404 598,404 592,414" fill="#000"/>
  <text x="600" y="402" font-size="11">Zeiger am Rahmen</text>
  <text x="600" y="446" font-size="11" fill="#b00000">Maßband an der Seitenfläche (nicht im Bild), Schritt 300</text>

  <!-- ========== Legende ========== -->
  <g font-size="12">
    <text x="20" y="500">Rahmen aus Dachlatten 24 x 48: zwei Portale (Querlatte unten liegt auf der Fläche, zwei Pfosten, Querlatte oben),</text>
    <text x="20" y="518">verbunden durch zwei Längslatten. Handy mittig am Kamerastab, Objektiv senkrecht nach unten, Bild-Längsachse = Balkenachse.</text>
    <text x="20" y="536">Haube über den Rahmen, seitlich bis unter die Balkenoberkante: kein Hallenlicht, schwarzer Hintergrund neben beiden Kanten.</text>
    <text x="20" y="554">Bildfeld und Px/mm gelten für Hauptkamera 1x (24 mm KB), 48 MP. Vor Freitag am Probebrett nachmessen.</text>
  </g>
</svg>
