# Linter für das ganze Repo. Aufruf über ./pruefen.sh.
# Bewusst nur Regeln, die echte Fehler finden (keine reinen Stilfragen).
# E4/E7/E9: Syntax und grobe Fehler, F: unbenutzte/undefinierte Namen, B: typische Fallen.
target-version = "py312"
extend-exclude = ["data", "logs", "protokolle"]

[lint]
select = ["E4", "E7", "E9", "F", "B"]
