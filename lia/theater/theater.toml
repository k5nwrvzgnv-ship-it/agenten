# Vorgaben für Lias Fassung von „Der nackte Wahnsinn“ (aus Erste_Gedanken.docx, Figuren.docx und Lias Nachricht
# vom 29.10.2026). Keine Schülerdaten. Für Claude schreibgeschützt (*.toml).

[stueck]
titel = "Der nackte Wahnsinn"
autor = "Michael Frayn"
textfassung = "data/text/eingang__e-245-der-nackte-wahnsinn.pdf.txt"

[rahmen]
minuten_min = 35
minuten_max = 40
spieler = 18
einheiten = "etwa 20 Einheiten à 60 Minuten plus 2–3 halbe Tage"
koennen = ["Kompositionsmethoden", "chorisches Sprechen", "Status", "bewegte Standbilder"]
# Lias Zeitplan aus Figuren.docx: Eröffnung 3 Min, je Akt 10 Min
teile = [
  { akt = 0, name = "Eröffnung", minuten = 3 },
  { akt = 1, name = "Akt 1: Generalprobe (4. Wand bleibt)", minuten = 10 },
  { akt = 2, name = "Akt 2: Premiere (Publikum einbezogen)", minuten = 10 },
  { akt = 3, name = "Akt 3: Dernière (komplettes Chaos)", minuten = 10 },
]

