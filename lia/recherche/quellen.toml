urls = ["https://www.gesetze-im-internet.de/jgg/__2.html"]

[[quelle]]
id = "kant-mds-strafrecht"
art = "primaertext"
autor = "Immanuel Kant"
todesjahr_autor = 1804
werk = "Die Metaphysik der Sitten (1797), Metaphysische Anfangsgründe der Rechtslehre, Allgemeine Anmerkung E: Vom Straf- und Begnadigungsrecht"
ausgabe = "Kant's gesammelte Schriften (Akademie-Ausgabe), Bd. 6, S. 331–337, nach dem Bonner Kant-Korpus (korpora.org)"
# Der Herausgeber des Bandes ist auf korpora.org nicht genannt (geprüft 25.10.2026:
# Startseite, Inhaltsverzeichnis Bd. 6, Gesamtverzeichnis). Darum leer = ungeklärt. Nicht raten.
herausgeber = ""
seiten = [331, 332, 333, 334, 335, 336, 337]
urls = [
  "https://korpora.org/kant/aa06/331.html",
  "https://korpora.org/kant/aa06/332.html",
  "https://korpora.org/kant/aa06/333.html",
  "https://korpora.org/kant/aa06/334.html",
