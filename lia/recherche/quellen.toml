# Quellen für Lias Examensreihe (Straftheorien, Ethik Klasse 8). Von Hand gepflegt.
# Der Agent lädt jede URL über agentkit.abruf (nur Domains aus [abruf] allowlist, nur https),
# baut daraus data/text/<id>.txt und trägt die Quelle in data/register.json ein.
#
# Felder je [[quelle]]:
#   id, art (gesetz | primaertext), werk, ausgabe, urls (Liste)
#   autor, todesjahr_autor            bei primaertext Pflicht
#   herausgeber, herausgeber_todesjahr  falls es einen gibt; leerer Name = ungeklärt
#   uebersetzer, uebersetzer_todesjahr  ebenso
#   seiten                            Seitenzahlen der Vorlage, eine je URL (korpora.org)
# Gemeinfreiheit: gemeinfrei.py. Fehlt ein Name oder Todesjahr, ist die Quelle ungeklärt und
# darf nicht verwendet werden.

[abruf]
# Von Jan freigegeben am 25.10.2026
allowlist = ["gesetze-im-internet.de", "de.wikisource.org", "zeno.org", "korpora.org", "archive.org"]

[[quelle]]
id = "stgb-46"
art = "gesetz"
werk = "Strafgesetzbuch (StGB), § 46 Grundsätze der Strafzumessung"
ausgabe = "gesetze-im-internet.de (Bundesamt für Justiz), Fassung am Abrufdatum"
urls = ["https://www.gesetze-im-internet.de/stgb/__46.html"]

[[quelle]]
id = "jgg-2"
art = "gesetz"
werk = "Jugendgerichtsgesetz (JGG), § 2 Ziel des Jugendstrafrechts; Anwendung des allgemeinen Strafrechts"
