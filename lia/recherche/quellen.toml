# kein Text auf Wikisource, im Deutschen Textarchiv oder (soweit prüfbar) bei digitale-sammlungen.de.
scan_id = "zeitschriftgesa00berluoft"
druckseiten = [1, 47]
# n = Blatt - 1. Am Bild geprüft (25.10.2026): n22 = S. 1 (Titel „Der Zweckgedanke im Strafrecht“),
# n23 = S. 2, n68 = S. 47 (Aufsatzende). page_numbers.json belegt ab S. 3 (Blatt 25, confidence 100),
