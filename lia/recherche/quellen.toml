# Die OCR dieses Scans ist für Wortlaut unbrauchbar (Fraktur als Antiqua gelesen: „unb“ statt „und“).
# Darum Kernstellen vom Seitenbild (seitenbild.py); Lia prüft jede am Scan. Gesucht und nicht brauchbar
