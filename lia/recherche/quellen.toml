position = "Besserung (Tätertyp 2): lange statt kurzer Haft"
zweck = "Zeigt, dass Liszt nicht mild ist: Besserung heißt bei ihm mindestens ein Jahr Freiheitsstrafe, kurze Strafen lehnt er ab."

[[quelle.stelle_von_hand]]
