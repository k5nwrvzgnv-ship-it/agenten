position = "Besserung (Tätertyp 2: Besserungsbedürftige)"
zweck = "Zeigt, wen Liszt bessern will: Täter, die zum Verbrechen neigen, aber noch nicht verloren sind."

[[quelle.stelle_von_hand]]
seiten = [41]
anfang = "Das Minimum der hier eintretenden Freiheitsstrafe"
