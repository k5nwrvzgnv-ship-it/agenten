position = "Unschädlichmachung (Tätertyp 1: Gewohnheitsverbrecher)"
zweck = "Zeigt, welche Taten Liszt den Gewohnheitsverbrechern zuordnet: vor allem Eigentumsdelikte wie Diebstahl und Raub."

[[quelle.stelle_von_hand]]
seiten = [39]
anfang = "Die „Unschädlichmachung“ der Unverbesserlichen denke ich mir"
ende = "auf unbestimmte Zeit zu erkennen sei."
position = "Unschädlichmachung (Tätertyp 1)"
zweck = "Zeigt: Liszt fordert für Rückfällige nach der dritten Verurteilung Haft auf unbestimmte Zeit."

[[quelle.stelle_von_hand]]
seiten = [40]
anfang = "Zweite Gruppe. Die Besserungsbedürftigen."
