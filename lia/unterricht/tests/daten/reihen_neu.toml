[[reihe]]
id = "ethik-8-straftheorien"
klasse = "ethik-8"
titel = "Straftheorien (in Planung)"
stand = "geplant"
agenten = ["examen"]
notizen = """Nächste Reihe: Straftheorien (Vergeltung, Besserung, Prävention), stark vereinfacht, am liebsten am \
Thema Gefängnisstrafe. Positionen (Lia, 24.10.2026): erst Kant (absolute Straftheorie, \
Vergeltung), dann von Liszt als Gegenposition (relative Straftheorie). Welche Strafzwecke bei von Liszt im \
Vordergrund stehen (etwa Besserung, Abschreckung), ist noch offen. Die Reihenfrage steht noch nicht fest, Lia sucht noch nach einer guten."""
behandelt = ["Peter Singer", "Aristoteles", "Kant", "Jeremy Bentham", "John Rawls", "John Stuart Mill"]
bisherige_reihen = [
    "Klasse 7, Lüge und Wahrheit: Sollte ich lügen, um einen Freund zu schützen?",
    "Klasse 7, Gerechtes Verteilen: Wie verteilt man gerecht, wenn nicht genug für alle da ist?",
    "Klasse 7, Freundschaft: Wie erkenne ich einen guten Freund?",
    "Klasse 7, Tiere töten: Sollte in unserer Schulmensa nur einmal pro Woche Fleisch angeboten werden?",
    "Klasse 7, Glückliches Leben: Wie führe ich ein glückliches Leben?",
    """Klasse 8, Helfen: Muss ich fremden Menschen in Not genauso helfen wie Nahestehenden? Merksätze (Lia, \
24.10.2026): Peter Singer: „Wenn die Not der Person groß ist und meine eigenen Kosten im Vergleich kleiner, dann \
muss ich helfen. Egal ob die Person nah oder fremd ist.“ Aristoteles: „Wenn mir ein Mensch nahesteht, dann \
schulde ich ihm mehr als einem Fremden. Das gilt besonders, wenn er viel Gutes für mich getan hat.“""",
]

