# Lias laufende Unterrichtsreihen. Jeder Lauf von unterricht bekommt sie mit (reihen.py),
# Claude nimmt die Reihe, die zum Wunsch passt. Von Jan von Hand gepflegt; abgeschlossene Reihen nach
# bisherige_reihen verschieben.
#
# Je Reihe ein Block [[reihe]]. Pflicht: klasse. Alles andere ist freiwillig:
# fach (ohne Angabe: Fach aus profil.toml), titel, reihenfrage (fehlt, solange die Reihe geplant wird),
# lerngruppe, notizen (Texte); behandelt, merksaetze, bisherige_reihen (Listen von Texten).

# Angaben von Lia, 23.10.2026. Merksätze hatte sie gerade nicht parat.
