function seitenVon(a, v) {
  if (!v.fall) return [];

      { id: "test", name: "Testfall", html: `<div><b>Testfall:</b> Nach Aristoteles' Freundschaft der Tugend hilft Mia, weil es um Jana selbst geht und nicht um einen Vorteil. Die Entscheidung ist eindeutig.</div>` },

function blattHtml(seite, nr, gesamt, waehlbar, anmerkungen) {
  const bl = seite.bloecke.map((b) => {
    if (!waehlbar) return b.html;
    const hat = anmerkungen.some((x) => x.seite === nr && x.block === b.id);
    return `<button type="button" class="block ${hat ? "hat" : ""}" data-block="${b.id}" aria-pressed="${z.block === b.id}" aria-label="${esc(b.name)} auswählen">${b.html}</button>`;
  }).join("");
  return `<div class="seite">${bl}<div class="fuss">Seite ${nr + 1} von ${gesamt}</div></div>`;
}

function beachteListe(n) {
  const punkte = [];

  else punkte.push("Keine Reihe gewählt. Dann kenne ich Klasse und Reihenfrage nicht.");
  const gest = n.art === "Theater" ? null : vorlagen.gestaltung.find((g) => g.stand === "aktiv" && g.name.startsWith("Arbeitsblatt"));
  if (gest && ["Material", "Text prüfen"].includes(n.art)) punkte.push(`Gestaltung: ${esc(gest.name)}.`);
  const typen = MUSTER_FUER[n.art] || [];
  const muster = vorlagen.muster.filter((m) => m.stand === "aktiv" && typen.includes(m.typ));
  if (muster.length) punkte.push(`Musterblätter als Anregung: ${muster.map((m) => esc(m.name)).join(", ")}.`);
  punkte.push(`${regeln.length} Regeln, die ich mir gemerkt habe (unter „Ich“).`);
  if (["Material", "Frage", "Recherche"].includes(n.art)) punkte.push(`Deine Materialsammlung (${vorlagen.sammlung.anzahl + vorlagen.sammlung.neu.length} Dateien) zum Nachschlagen.`);

}

      ${z.reiheOffen === r.id ? `<label class="feld klein" for="neu-position">Was ist dazugekommen?<input id="neu-position" type="text" placeholder="Zum Beispiel: Hegel: Strafe als Recht des Täters"></label>
        <div class="knoepfe"><button type="button" class="haupt" data-position-speichern="${r.id}">Speichern</button><button type="button" class="zweit" data-reihe-zu>Abbrechen</button></div>`
      : `<button type="button" class="zweit" data-reihe-auf="${r.id}">Behandeltes ergänzen</button>`}
    </div>`).join("")}</section>
    <button type="button" class="zweit" style="width:100%" data-demo>Neue Reihe anlegen</button>`;
}
function vorlageZeile(v, mitTyp) {
  const aktiv = v.stand === "aktiv";
  return `<div class="karte ruhig">
    <div class="zeile"><span class="titel">${esc(v.name)}</span><span class="pille ${aktiv ? "p-fertig" : v.stand === "liest" ? "p-arbeit" : "p-warten"}">${aktiv ? "wird genutzt" : v.stand === "liest" ? "wird gelesen" : "pausiert"}</span></div>
    <span class="klein">${mitTyp ? `<b>${esc(v.typ)}:</b> ${esc(v.warum)}` : esc(v.info)}</span>
    ${v.stand === "liest" ? "" : `<div class="knoepfe"><button type="button" class="zweit mini" data-vorlage-ansehen="${v.id}">Ansehen</button><button type="button" class="zweit mini" data-vorlage-pause="${v.id}">${aktiv ? "Nicht mehr nutzen" : "Wieder nutzen"}</button></div>`}
  </div>`;
}
function vVorlagen() {
  const s = vorlagen.sammlung;
  return `<p class="leise" style="margin:14px 0 0">Deine Dateien bleiben deine. Ich nutze sie nur so, wie es hier steht.</p>
    <section class="gruppe"><h2 class="etikett">Gestaltung</h2>
      <span class="klein leise">So sehen alle neuen Arbeitsblätter und Folien aus: Kopfzeile, Logo, Ränder, Schrift. Eine Word- oder PowerPoint-Datei.</span>
      ${vorlagen.gestaltung.map((v) => vorlageZeile(v, false)).join("")}
      <input class="unsichtbar" id="vl-gestaltung" type="file" accept=".docx,.dotx,.pptx,.potx">
      <label for="vl-gestaltung" class="zweit" style="display:grid;place-items:center">Gestaltung hochladen</label></section>
    <section class="gruppe"><h2 class="etikett">Musterblätter</h2>
      <span class="klein leise">Gelungene Beispiele je Materialtyp. Ich nehme sie als Anregung, nicht als Schablone.</span>
      ${vorlagen.muster.map((v) => vorlageZeile(v, true)).join("")}
      <label class="feld klein" for="vl-muster-typ">Für welchen Typ?<select id="vl-muster-typ"><option>Fallbeispiel</option><option>Arbeitsblatt-Text</option><option>Argumentieren</option><option>Aufgaben und Kärtchen</option><option>Theater</option></select></label>
      <input class="unsichtbar" id="vl-muster" type="file" accept="image/*,.pdf,.docx,.pptx">
      <label for="vl-muster" class="zweit" style="display:grid;place-items:center">Musterblatt hinzufügen</label></section>
    <section class="gruppe"><h2 class="etikett">Materialsammlung</h2>
      <div class="karte ruhig"><div class="zeile"><span class="titel">${s.anzahl + s.neu.length} Dateien</span><span class="pille p-fertig">zum Nachschlagen</span></div>
        <span class="klein">Alte Arbeitsblätter, Texte, Folien. Ich suche darin, wenn es passt, und sage dir, welche Datei ich genutzt habe.</span>
        <span class="klein leise">Zuletzt: ${[...s.neu.map((n) => n.name + (n.stand === "liest" ? " (wird gelesen)" : "")), ...s.zuletzt].slice(0, 4).map(esc).join(", ")}</span></div>
      <input class="unsichtbar" id="vl-sammlung" type="file" multiple accept="image/*,.pdf,.docx,.pptx,.xlsx">
      <label for="vl-sammlung" class="zweit" style="display:grid;place-items:center">Dateien hinzufügen</label></section>
    <p class="hinweis"><b>Bitte keine Namen</b> von Schülerinnen und Schülern in Vorlagen. Ausgefüllte Blätter vorher schwärzen.</p>`;
}
function vIch() {
  return `<div class="kopf"><h1>Ich</h1></div>
    <section class="gruppe"><h2 class="etikett">Was ich mir gemerkt habe</h2>
      ${regeln.map((r, i) => `<div class="regel ${r.frisch ? "frisch" : ""}"><span>${esc(r.text)}</span><span class="klein leise">${esc(r.her)}</span>
        <button type="button" class="zweit mini" data-regel-stopp="${i}" style="justify-self:start">Nicht mehr beachten</button></div>`).join("")}</section>
    <section class="gruppe"><h2 class="etikett">Benachrichtigungen</h2>
      <label class="schalter" for="n-tg"><span>Hinweis über Telegram, wenn etwas fertig ist</span><input id="n-tg" type="checkbox" checked></label>
      <label class="schalter" for="n-push"><span>Hinweis direkt aufs Handy <span class="klein leise">(kommt später)</span></span><input id="n-push" type="checkbox" disabled></label></section>
    <section class="gruppe"><h2 class="etikett">Anmelden</h2>
      <div class="datei"><span>iPhone (Face ID)<br><span class="klein leise">seit 02.11.</span></span><button type="button" class="zweit mini weg" data-demo>Entfernen</button></div>
      <button type="button" class="zweit" data-demo>Weiteres Gerät hinzufügen</button>
      <button type="button" class="zweit weg" data-demo>Überall abmelden</button></section>
    <section class="gruppe"><h2 class="etikett">Für den Test</h2>
      <button type="button" class="zweit" data-bereich="test">Testleitung (für Jan)</button></section>`;
}
function vTest() {
  const zeilen = AUFGABEN.map(([nr, t]) => {
    const e = test.ergebnisse[nr];
    const lauf = test.aktiv === nr;
    return `<tr><td><b>${nr}</b></td><td>${esc(t)}</td><td>${e ? `${e.erfolg === "ja" ? "geschafft" : esc(e.erfolg)}, ${e.sek} s` : lauf ? "läuft …" : ""}<br>
      ${lauf ? `<button type="button" class="zweit mini" data-test-hilfe="${nr}">mit Hilfe</button> <button type="button" class="zweit mini weg" data-test-abbruch="${nr}">nein</button>` : e ? "" : `<button type="button" class="zweit mini" data-test-start="${nr}">Start</button>`}</td></tr>`;
  }).join("");
  const text = AUFGABEN.map(([nr]) => { const e = test.ergebnisse[nr]; return `${nr}\t${e ? e.erfolg : "-"}\t${e ? e.sek : "-"}`; }).join("\n");
  return `<div class="kopf"><button type="button" class="zurueck" data-bereich="ich">Zurück</button><h1>Testleitung</h1></div>
    <div class="test"><p class="klein leise">Start tippen, Aufgabe vorlesen, Handy an Lia geben. Die Zeit stoppt von selbst, wenn die Aufgabe gelöst ist. Schwierigkeit 1–7 und Zitate auf Papier. A1–A5 auch in Telegram, A6 und A7 nur hier.</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Nr.</th><th>Aufgabe</th><th>Ergebnis</th></tr></thead><tbody>${zeilen}</tbody></table></div>
    <h2 class="etikett" style="margin-top:16px">Zum Abschreiben</h2><pre id="test-text">Nr.\tErfolg\tSekunden\n${esc(text)}</pre>
    <button type="button" class="zweit" id="test-kopieren">Kopieren</button></div>`;
}

function zeichnen() {
  leiste();
  let html;
  const d = z.detail;
  if (d && d.typ === "auftrag") html = vAuftrag(auftrag(d.id));
  else if (d && d.typ === "seite") html = vSeite(auftrag(d.id));
  else if (d && d.typ === "entwurf") html = vEntwurf(entwuerfe.find((e) => e.id === d.id));
  else html = { heute: vHeute, neu: vNeu, anfragen: vAnfragen, unterricht: vUnterricht, ich: vIch, test: vTest }[z.bereich]();
  $("#ansicht").innerHTML = html;
}

// ---------- Bedienung ----------
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  const d = b.dataset;
  if (d.bereich) return gehe(d.bereich);
  if (d.zurueck !== undefined) {
    if (z.detail && z.detail.typ === "seite") { z.block = null; return gehe(z.bereich, { typ: "auftrag", id: z.detail.id }); }
    return gehe(z.bereich);
  }
  if (d.auftrag) return gehe(z.bereich, { typ: "auftrag", id: d.auftrag });
  if (d.entwurf) return gehe(z.bereich, { typ: "entwurf", id: d.entwurf });
  if (d.art) { z.neu.text = $("#auftrag-text").value; z.neu.art = d.art; return zeichnen(); }
  if (b.id === "abschicken") return abschicken();
  if (d.version) { z.version[z.detail.id] = Number(d.version); return zeichnen(); }
  if (d.seite) { z.seite = Number(d.seite); z.block = null; return gehe(z.bereich, { typ: "seite", id: z.detail.id }); }
  if (d.block) { z.block = z.block === d.block ? null : d.block; const t = $("#anm-text").value; zeichnen(); $("#anm-text").value = t; $("#anm-text").focus({ preventScroll: true }); return; }
  if (d.blatt) { z.seite += Number(d.blatt); z.block = null; return zeichnen(); }
  if (d.anmSpeichern) return anmerkungSpeichern(d.anmSpeichern);
  if (d.anmWeg) { z.anm[z.detail.id].splice(Number(d.anmWeg), 1); return zeichnen(); }
  if (d.fb) return feedback(d.fb);
  if (d.umfang) return umfangGewaehlt(d.umfang);
  if (d.nachbessern) return nachbessern(d.nachbessern, "", false);
  if (d.nachbessernText) return nachbessern(d.nachbessernText, $("#aendern-text").value.trim(), $("#aendern-immer").checked);
  if (d.regelWeg) { const r = z.rueck[d.regelWeg]; regeln.splice(r.regel, 1); r.regel = null; zeichnen(); return toast("Gut, das merke ich mir nicht."); }
  if (d.laden) { if (d.laden === "fallsuche") geschafft("A5"); return toast(`Im Prototyp gibt es keine echte Datei. In der App öffnet sich hier die ${d.format === "PDF" ? "PDF" : "Word-Datei"}.`); }
  if (d.selbst) { z.erledigt[d.selbst] = "Abgeschlossen. Du setzt ihn selbst ein, es wurde nichts verschickt."; geschafft("A3"); zeichnen(); return toast("Abgeschlossen", "Rückgängig", () => { delete z.erledigt[d.selbst]; zeichnen(); }, 10000); }
  if (d.freigeben) { z.erledigt[d.freigeben] = "Freigegeben. Im Prototyp wird nichts gesendet."; zeichnen(); return toast("Geht in 10 Sekunden raus", "Rückgängig", () => { delete z.erledigt[d.freigeben]; zeichnen(); }, 10000); }
  if (d.ablehnen) { z.erledigt[d.ablehnen] = "Abgelehnt. Es wurde nichts verschickt."; zeichnen(); return toast("Abgelehnt", "Rückgängig", () => { delete z.erledigt[d.ablehnen]; zeichnen(); }, 10000); }
  if (d.eAendern) return toast("In der App schreibst du hier, was anders werden soll.");
  if (d.nochmal) { Object.assign(auftrag(d.nochmal), { stand: "arbeit", fortschritt: 5, eta: "fertig in etwa 15 Minuten", zeit: "gerade eben" }); zeichnen(); return toast("Ist wieder unterwegs."); }
  if (d.zurueckziehen) { const i = auftraege.findIndex((x) => x.id === d.zurueckziehen); const [weg] = auftraege.splice(i, 1); gehe(z.bereich); return toast("Zurückgezogen", "Rückgängig", () => { auftraege.splice(i, 0, weg); zeichnen(); }, 10000); }
  if (d.filter) { z.filter = d.filter; return zeichnen(); }
  if (d.unterricht) { z.unterricht = d.unterricht; z.reiheOffen = null; return zeichnen(); }
  if (d.reiheAuf) { z.reiheOffen = d.reiheAuf; zeichnen(); const f = $("#neu-position"); f && f.focus(); return; }
  if (d.reiheZu !== undefined) { z.reiheOffen = null; return zeichnen(); }
  if (d.positionSpeichern) return positionSpeichern(d.positionSpeichern);
  if (d.vorlageAnsehen) return toast("In der App siehst du hier eine Probeseite mit dieser Vorlage.");
  if (d.vorlagePause) { const v = [...vorlagen.gestaltung, ...vorlagen.muster].find((x) => x.id === d.vorlagePause); v.stand = v.stand === "aktiv" ? "pausiert" : "aktiv"; zeichnen(); return toast(v.stand === "aktiv" ? "Nutze ich wieder." : "Nutze ich ab jetzt nicht mehr. Die Datei bleibt hier."); }
  if (d.regelStopp) return toast("Ich frage Jan, ob ich diese Regel weglassen darf. Bis dahin gilt sie.");
  if (d.demo !== undefined) return toast("Im Prototyp noch nicht dabei.");
  if (d.testStart) { test.aktiv = d.testStart; test.start = Date.now(); gehe("heute"); return toast(`${d.testStart} läuft. Handy an Lia geben.`); }
  if (d.testHilfe || d.testAbbruch) { const nr = d.testHilfe || d.testAbbruch; test.ergebnisse[nr] = { erfolg: d.testHilfe ? "mit Hilfe" : "nein", sek: Math.round((Date.now() - test.start) / 1000) }; test.aktiv = null; return zeichnen(); }
  if (b.id === "test-kopieren") {
    navigator.clipboard.writeText($("#test-text").textContent).then(() => toast("Kopiert"), () => { const r = document.createRange(); r.selectNodeContents($("#test-text")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Text ist markiert, bitte selbst kopieren."); });
  }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "auftrag-text") z.neu.text = ev.target.value;
  if (ev.target.id === "suche") { z.suche = ev.target.value; const pos = ev.target.selectionStart; zeichnen(); const f = $("#suche"); f.focus(); f.setSelectionRange(pos, pos); }
});
document.addEventListener("change", (ev) => {
  const id = ev.target.id;
  if (id === "auftrag-reihe") { z.neu.text = $("#auftrag-text").value; z.neu.reihe = ev.target.value; zeichnen(); }
  if (id === "auftrag-datei") { z.neu.text = $("#auftrag-text").value; z.neu.dateien = [...ev.target.files].map((f) => f.name); zeichnen(); }
  if (id === "vl-gestaltung" || id === "vl-muster" || id === "vl-sammlung") vorlageHochladen(id, [...ev.target.files]);
});

function abschicken() {
  const n = z.neu;
  n.text = $("#auftrag-text").value.trim();
  if (!n.text) { toast("Schreib kurz, was du brauchst."); $("#auftrag-text").focus(); return; }
  const a = { id: "n" + Date.now(), art: n.art, titel: n.text.length > 70 ? n.text.slice(0, 69) + "…" : n.text, reihe: n.reihe || null,
    stand: "arbeit", fortschritt: 5, zeit: "gerade eben", eta: "fertig in etwa 15 Minuten" };
  if (n.art === "Material" && n.reihe === "pflicht" && n.dateien.length && /imperativ/i.test(n.text)) geschafft("A1");
  auftraege.unshift(a);
  const alt = { ...n };
  z.neu = { art: "Material", text: "", reihe: n.reihe, dateien: [] };
  gehe("heute");
  toast("Ist unterwegs. Ich melde mich, wenn es fertig ist.", "Zurücknehmen", () => {
    auftraege.splice(auftraege.indexOf(a), 1); z.neu = alt; gehe("neu");
  }, 10000);
}
function feedback(art) {
  const id = z.detail.id;
  z.umfang = null;
  if (art === "aendern" || art === "fokus") { z.aendernOffen = !(z.aendernOffen && z.aendernArt === art); z.aendernArt = art; zeichnen(); const f = $("#aendern-text"); f && f.focus(); return; }
  z.aendernOffen = false;
  if (art === "passt") { z.rueck[id] = { danke: "Ich merke mir, dass dieses Ergebnis so passt. Es kann später als Musterblatt dienen." }; return zeichnen(); }
  if (art === "lang") { z.umfang = { id, frage: "Zu lang nur bei diesem Ergebnis oder ab jetzt immer bei Fallbeispielen?" }; return zeichnen(); }
}
function umfangGewaehlt(wahl) {
  const id = z.umfang.id;
  z.umfang = null;
  nachbessern(id, "kürzer", wahl === "immer", "Fallbeispiele für Klasse 8: höchstens drei Sätze.");
}
function anmerkungSpeichern(id) {
  const text = $("#anm-text").value.trim();
  if (!text) { toast("Schreib kurz, was anders werden soll."); $("#anm-text").focus(); return; }
  const a = auftrag(id);
  const v = a.versionen[z.version[id] ?? a.versionen.length - 1];
  const s = seitenVon(a, v)[z.seite];
  const blk = s.bloecke.find((b) => b.id === z.block);
  (z.anm[id] = z.anm[id] || []).push({ seite: z.seite, block: blk ? blk.id : null, name: blk ? blk.name : "ganze Seite", text });
  z.block = null;
  zeichnen();
  toast("Gespeichert. Weitere Stellen antippen oder zurück zum Ergebnis.", "Zum Ergebnis", () => gehe(z.bereich, { typ: "auftrag", id }), 6000);
}
function nachbessern(id, wunsch, immer, regelText) {
  const a = auftrag(id);
  const anm = z.anm[id] || [];
  if (!wunsch && !anm.length) { toast("Schreib kurz, was anders werden soll."); return; }
  if (id === "fall" && (/kurz|lang|weniger/i.test(wunsch) || wunsch)) geschafft("A2");
  if (id === "fall" && anm.some((x) => x.block === "aufgabe")) geschafft("A6");
  const rueck = { nachbesserung: `Ich mache eine neue Fassung${anm.length ? ` mit deinen ${anm.length === 1 ? "Anmerkung" : anm.length + " Anmerkungen"}` : ""}. Die alte bleibt hier.`, regel: null };
  if (immer) {
    regeln.push({ text: regelText || wunsch, her: "aus deinem Feedback, heute", frisch: true });
    rueck.regel = regeln.length - 1;
  }
  z.rueck[id] = rueck;
  z.aendernOffen = false;
  const genutzt = anm.slice();
  z.anm[id] = [];
  zeichnen();
  setTimeout(() => {
    const kurz = /kurz|lang|weniger/i.test(wunsch);
    const ank = genutzt.some((x) => x.block === "aufgabe") || /kreuz/i.test(wunsch);
    const alt = a.versionen[a.versionen.length - 1];
    a.versionen.push({
      kern: [kurz ? "Kürzer: drei Sätze, eine Entscheidung" : "Geändert nach deinem Wunsch",
        genutzt.length ? `${genutzt.length === 1 ? "Deine Anmerkung ist" : "Deine " + genutzt.length + " Anmerkungen sind"} umgesetzt` : "Gleicher Begleittext",
        wunsch ? "Dein Wunsch: „" + wunsch + "“" : "Sonst unverändert"],
      pruefen: "", fall: alt.fall ? (kurz ? FALL_V2 : alt.fall) : undefined, aufgabe: alt.fall ? (ank ? AUFGABE_V2 : alt.aufgabe) : undefined });
    z.version[id] = a.versionen.length - 1;
    if (z.detail && z.detail.id === id) zeichnen();
    toast("Fassung " + a.versionen.length + " ist da.");
  }, 2500);
}
function positionSpeichern(id) {
  const wert = $("#neu-position").value.trim();
  if (!wert) { toast("Schreib kurz, was dazugekommen ist."); return; }
  reihe(id).behandelt.push(wert);
  if (id === "strafe" && /hegel/i.test(wert)) geschafft("A4");
  z.reiheOffen = null; zeichnen(); toast("Gespeichert. Ab jetzt beachte ich das.");
}
function vorlageHochladen(feld, dateien) {
  if (!dateien.length) return;
  const eintraege = [];
  if (feld === "vl-gestaltung") {
    const f = dateien[0];
    const v = { id: "g" + Date.now(), name: f.name, info: "Ab dem nächsten Auftrag nutze ich diese Gestaltung. Bisherige Ergebnisse bleiben, wie sie sind.", stand: "liest" };
    vorlagen.gestaltung.push(v); eintraege.push(v);
  } else if (feld === "vl-muster") {
    const typ = $("#vl-muster-typ").value;
    for (const f of dateien) { const v = { id: "m" + Date.now() + f.name, typ, name: f.name, warum: "Ich lese es und schreibe auf, was daran gut ist. Du kannst es korrigieren.", stand: "liest" }; vorlagen.muster.push(v); eintraege.push(v); }
    if (typ === "Fallbeispiel") geschafft("A7");
  } else {
    for (const f of dateien) { const v = { name: f.name, stand: "liest" }; vorlagen.sammlung.neu.unshift(v); eintraege.push(v); }
  }
  zeichnen();
  toast(dateien.length === 1 ? "Hochgeladen. Ich lese die Datei." : `${dateien.length} Dateien hochgeladen. Ich lese sie.`);
  setTimeout(() => { eintraege.forEach((v) => { v.stand = "aktiv"; }); if (z.bereich === "unterricht") zeichnen(); }, 2500);
}

const start = (location.hash || "").slice(1);
if (NAMEN[start] || start === "test") z.bereich = start;
if (start === "vorlagen") { z.bereich = "unterricht"; z.unterricht = "vorlagen"; }
zeichnen();
</script>
